<script type="text/babel" data-presets="env" data-plugins="transform-react-jsx">
const { useState, useEffect, useCallback, useRef } = React;

// ---- tiny inline icon set (no external icon package needed) ----------

  return (

      {children}
    </svg>
  );
}
const IconClock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;

const IconGear = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.38.36.72.6 1 .3.34.7.53 1.1.6H21v4h-.09c-.4.07-.8.26-1.1.6-.24.28-.45.62-.6 1z"/></Icon>;

// ---- tokens ----------------------------------------------------------
const INK = "#16262A";
const PAPER = "#F4F6F4";
const CARD = "#FFFFFF";
const LINE = "#DDE3E0";
const MUTED = "#5B6B6E";
const ACCENT = "#2E7D6B";
const SELECTED_GREEN = "#174D3C";
const PHONE_W = 430;
const STORAGE_KEY = "chairboard_patients_v1";
const CHECKED_STORAGE_KEY = "chairboard_checklists_v1";
const SETTINGS_STORAGE_KEY = "chairboard_alert_settings_v1";
const COMPLETED_STORAGE_KEY = "chairboard_completed_patients_v1";

const STAGES = {
  "chart-review": { label: "Chart Review", color: "#4C6FA3", previous: null, next: "pre-infusion-check", gate: "GENERAL" },
  "pre-infusion-check": { label: "Pre-Infusion Check", color: "#6E5AA3", previous: "chart-review", next: "premed-wait", gate: "PREINFUSION" },
  "premed-wait": { label: "Premed Wait", color: "#C98A2C", previous: "pre-infusion-check", next: "infusing", timer: true },
  infusing: { label: "Infusing \u00b7 pump-timed", color: "#2E7D6B", previous: "premed-wait", next: "observation", vitals: true },
  observation: { label: "Observation", color: "#8A5FBF", previous: "infusing", next: "discharge-check", timer: true, vitals: true },
  "discharge-check": { label: "End-of-Visit Check", color: "#3B7A57", previous: "observation", next: "complete", gate: "DISCHARGE" },
  complete: { label: "Complete", color: "#3B7A57", previous: "discharge-check", next: null },
};

const GENERAL_CHECKLIST = ["Allergies reviewed", "Treatment parameters met?", "Labs released?", "All Therapy Plans Reviewed", "Required consent done (i.e. chemo, blood)?", "Treatment signed & readied by pharmacy?", "Patient assessment"];
const DISCHARGE_CHECKLIST = [
  "Next appointment scheduled",
  "IV site documented (removal, condition)",
  "MAR reviewed \u2014 all administered meds charted",
  "All vitals completed",
  "Charges captured for medications given",
  "If #1, are education and systems assessment done?",
  "If Pump, Clamp check done",
];

function buildPreInfusionChecklist(patient) {
  const items = ["Required Labs Checked"];
  (patient.labs || []).forEach((lab) => items.push(lab));
  (patient.premeds || []).forEach((m) => items.push(`${m} given`));
  items.push("IV access/Port Access Documented");
  items.push("Name tag");
  items.push("Labeled bags");
  items.push("Rate and order match chart");
  return items;
}

function nextStageFor(patient) {
  if (patient.stage === "pre-infusion-check") return patient.premeds?.length ? "premed-wait" : "infusing";
  if (patient.stage === "infusing" && !(Number(patient.observationMin) > 0)) return "discharge-check";
  return STAGES[patient.stage].next;
}

function previousStageFor(patient) {
  if (patient.stage === "infusing") return patient.premeds?.length ? "premed-wait" : "pre-infusion-check";
  if (patient.stage === "discharge-check" && !(Number(patient.observationMin) > 0)) return "infusing";
  return STAGES[patient.stage].previous;
}

function mmss(min) {
  const m = Math.max(0, Math.floor(min));
  const s = Math.max(0, Math.round((min - m) * 60));
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function buildVitalsTimers(selections, startMs = Date.now()) {
  return (selections || []).map((selection) => {
    if (selection === "15") return { key: "15", label: "Vitals at 15 min", dueAt: startMs + 15 * 60000, remaining: 15, recurring: false };
    if (selection === "30") return { key: "30", label: "Vitals at 30 min", dueAt: startMs + 30 * 60000, remaining: 30, recurring: false };
    if (selection === "every30") return { key: "every30", label: "Vitals every 30 min", dueAt: startMs + 30 * 60000, remaining: 30, recurring: true };
    return { key: "end", label: "Vitals at end", dueAt: null, remaining: null, recurring: false };
  });
}
function buildMedicationVitalsTimers(selections, durationMin, startMs = Date.now()) {
  return buildVitalsTimers(selections, startMs).map((timer) => timer.key === "end" && Number(durationMin) > 0
    ? { ...timer, dueAt: startMs + Number(durationMin) * 60000, remaining: Number(durationMin) }
    : timer);
}
function locLabel(p) { return `${p.type === "chair" ? "C" : "B"}${p.number}`; }
function locWord(p) { return p.type === "chair" ? "Chair" : "Bed"; }
function activeCountdowns(patient) {
  const timers = [];
  const add = (label, remaining) => {
    if (remaining !== null && remaining !== undefined && remaining > 0) timers.push({ label, remaining });
  };
  if (STAGES[patient.stage]?.timer && patient.timerEndsAt) add(patient.stage === "premed-wait" ? "PRE" : "OBS", patient.remaining);
  else if (patient.stage === "pre-infusion-check" && patient.premedTimerStarted && patient.timerEndsAt) add("PRE", patient.remaining);
  if (patient.stage === "infusing") {
    (patient.medicationRuns || []).forEach((run, medicationIndex) => {
      if (run.status === "running" && run.expectedEndsAt) add(`M${medicationIndex + 1}`, run.remainingMin);
      if (run.observationTimer?.dueAt && run.observationTimer.remaining > 0) add(`O${medicationIndex + 1}`, run.observationTimer.remaining);
      (run.vitalsTimers || []).forEach((timer) => {
        if (!timer.completedAt && timer.dueAt) add(`V${medicationIndex + 1}`, timer.remaining);
      });
    });
    if (patient.customCountdown?.status === "running") add("ALT", patient.customCountdown.remaining);
  }
  if (patient.stage === "observation") (patient.medicationRuns || []).forEach((run, medicationIndex) => {
    if (run.observationTimer?.dueAt && run.observationTimer.remaining > 0) add(`O${medicationIndex + 1}`, run.observationTimer.remaining);
  });
  return timers.sort((a, b) => a.remaining - b.remaining);
}

function useVoiceInput(onResult) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const recRef = useRef(null);
  const start = useCallback(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = false;
    rec.lang = "en-US";
    rec.onresult = (e) => onResult(e.results[0][0].transcript);
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
    try { rec.start(); setListening(true); } catch { setListening(false); }
  }, [onResult]);
  const stop = useCallback(() => { recRef.current?.stop(); setListening(false); }, []);
  return { listening, supported, start, stop };
}

function FieldLabel({ children }) {
  return <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", color: MUTED, marginBottom: 6 }}>{children}</div>;
}

function Stepper({ value, onChange, step = 5, min = 0, highlighted = false }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
      <button onClick={() => onChange(Math.max(min, value - step))} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>-</button>
      <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, width: 48, height: 40, display: "inline-flex", alignItems: "center", justifyContent: "center", borderRadius: 8, background: highlighted ? SELECTED_GREEN : CARD, border: `1px solid ${highlighted ? SELECTED_GREEN : LINE}`, color: highlighted ? "#FFF" : INK }}>{value}</span>
      <button onClick={() => onChange(value + step)} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>+</button>
      <span style={{ fontSize: 12, color: MUTED }}>min</span>
    </div>
  );
}

function OrderedListEditor({ items, onChange, placeholder, entryName, onPendingChange, forwardedInputRef }) {
  const [draft, setDraft] = useState("");
  const inputRef = useRef(null);
  const add = () => {
    if (!draft.trim()) return;
    onChange([...items, draft.trim()]);
    setDraft("");
    onPendingChange(false);
  };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const move = (i, dir) => {
    const next = [...items]; const j = i + dir;
    if (j < 0 || j >= next.length) return;
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  return (
    <div data-entry-editor={entryName}>
      {items.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {items.map((item, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, background: PAPER, border: `1px solid ${LINE}` }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: MUTED }}>{i + 1}</span>
              <span style={{ flex: 1, fontSize: 14, color: INK }}>{item}</span>
              <button onClick={() => move(i, -1)} disabled={i === 0} style={{ color: i === 0 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconUp size={16} /></button>
              <button onClick={() => move(i, 1)} disabled={i === items.length - 1} style={{ color: i === items.length - 1 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconDown size={16} /></button>
              <button onClick={() => remove(i)} style={{ color: "#B0413E", background: "none", border: "none" }}><IconX size={16} /></button>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input ref={(element) => { inputRef.current = element; if (forwardedInputRef) forwardedInputRef.current = element; }} value={draft} onChange={(e) => { setDraft(e.target.value); onPendingChange(!!e.target.value.trim()); }} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }}
          onBlur={() => { if (draft.trim()) setTimeout(() => inputRef.current?.focus(), 0); }}
          placeholder={placeholder} style={{ flex: 1, fontSize: 14, padding: "10px 12px", borderRadius: 8, border: `1px solid ${draft.trim() ? "#B0413E" : LINE}`, color: INK, outline: "none" }} />
        <button onClick={add} style={{ width: 42, height: 42, borderRadius: 8, border: `1px solid ${LINE}`, color: MUTED, background: CARD, display: "flex", alignItems: "center", justifyContent: "center" }}><IconPlus size={18} /></button>
      </div>
      {draft.trim() && <div role="alert" style={{ marginTop: 6, fontSize: 12, color: "#B0413E" }}>Press Return to add this entry, or delete the text to continue.</div>}
    </div>
  );
}

function MedicationListEditor({ items, onChange, forwardedInputRef }) {
  const [draft, setDraft] = useState("");
  const durationRefs = useRef([]);
  const add = () => {
    if (!draft.trim()) return;
    const newIndex = items.length;
    onChange([...items, { name: draft.trim(), filterRequired: false, durationMin: 0, observationMin: 0, vitalsSelections: [], postVitalsEnabled: false, postVitalsMin: 30 }]);
    setDraft("");
    setTimeout(() => { durationRefs.current[newIndex]?.focus(); durationRefs.current[newIndex]?.select(); }, 0);
  };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const move = (i, dir) => {
    const next = [...items];
    const j = i + dir;
    if (j < 0 || j >= next.length) return;
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  const setFilterRequired = (i, checked) => onChange(items.map((med, idx) => idx === i ? { ...med, filterRequired: checked } : med));
  const setDuration = (i, value) => onChange(items.map((med, idx) => idx === i ? { ...med, durationMin: Math.max(0, Number(value) || 0) } : med));
  const setObservation = (i, value) => onChange(items.map((med, idx) => idx === i ? { ...med, observationMin: Math.max(0, Number(value) || 0) } : med));
  const setPostVitalsEnabled = (i) => onChange(items.map((med, idx) => idx === i ? { ...med, postVitalsEnabled: !med.postVitalsEnabled, postVitalsMin: Number(med.postVitalsMin) > 0 ? Number(med.postVitalsMin) : 30 } : med));
  const setPostVitalsMin = (i, value) => onChange(items.map((med, idx) => idx === i ? { ...med, postVitalsMin: Math.max(1, Number(value) || 1) } : med));
  const toggleVitals = (i, value) => onChange(items.map((med, idx) => {
    if (idx !== i) return med;
    const selections = med.vitalsSelections || [];
    return { ...med, vitalsSelections: selections.includes(value) ? selections.filter((entry) => entry !== value) : [...selections, value] };
  }));
  return (
    <div>
      {items.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {items.map((med, i) => (
            <div key={i} style={{ padding: "8px 10px", borderRadius: 8, background: ["#F1F3F3", "#EEF5FA", "#EFF7F1"][i % 3], border: `1px solid ${LINE}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: MUTED }}>{i + 1}</span>
                <span style={{ flex: 1, fontSize: 14, color: INK }}>{med.name}</span>
                <button onClick={() => move(i, -1)} disabled={i === 0} style={{ color: i === 0 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconUp size={16} /></button>
                <button onClick={() => move(i, 1)} disabled={i === items.length - 1} style={{ color: i === items.length - 1 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconDown size={16} /></button>
                <button onClick={() => remove(i)} style={{ color: "#B0413E", background: "none", border: "none" }}><IconX size={16} /></button>
              </div>
              <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, marginLeft: 19, fontSize: 13, color: MUTED }}>
                <input type="checkbox" checked={med.filterRequired} onChange={(e) => setFilterRequired(i, e.target.checked)} />
                Filter required?
              </label>
              <div style={{ marginTop: 12, marginLeft: 19 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: INK, marginBottom: 6 }}>Infusion/injection duration</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input ref={(element) => { durationRefs.current[i] = element; }} type="number" min="0" inputMode="numeric" value={med.durationMin || 0} onChange={(e) => setDuration(i, e.target.value)} aria-label={`${med.name} duration in minutes`}
                    style={{ width: 72, height: 38, padding: "0 8px", borderRadius: 8, border: `1px solid ${LINE}`, fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, textAlign: "center", color: INK }} />
                  <span style={{ fontSize: 12, color: MUTED }}>minutes (0 for no duration)</span>
                </div>
              </div>
              <div style={{ marginTop: 12, marginLeft: 19 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: INK, marginBottom: 6 }}>Vitals During?</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 5 }}>
                  {[{ label: "15", value: "15" }, { label: "30", value: "30" }, { label: "End", value: "end" }, { label: "Every 30", value: "every30" }].map((option) => {
                    const selected = (med.vitalsSelections || []).includes(option.value);
                    return <button key={option.value} onClick={() => toggleVitals(i, option.value)} style={{ padding: "8px 2px", borderRadius: 7, border: `1px solid ${selected ? SELECTED_GREEN : LINE}`, background: selected ? SELECTED_GREEN : CARD, color: selected ? "#FFF" : INK, fontSize: 11, fontWeight: 600 }}>{option.label}</button>;
                  })}
                </div>
              </div>
              <div style={{ marginTop: 12, marginLeft: 19 }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: INK, marginBottom: 6 }}>Observation period after this medication</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <button onClick={() => setObservation(i, Number(med.observationMin || 0) - 5)} style={{ width: 36, height: 36, borderRadius: 7, border: `1px solid ${LINE}`, background: CARD, color: INK }}>-</button>
                  <input type="number" min="0" inputMode="numeric" value={med.observationMin || 0} onChange={(e) => setObservation(i, e.target.value)} aria-label={`${med.name} observation duration in minutes`} style={{ width: 64, height: 36, borderRadius: 7, border: `1px solid ${Number(med.observationMin) > 0 ? SELECTED_GREEN : LINE}`, background: Number(med.observationMin) > 0 ? SELECTED_GREEN : CARD, color: Number(med.observationMin) > 0 ? "#FFF" : INK, textAlign: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }} />
                  <button onClick={() => setObservation(i, Number(med.observationMin || 0) + 5)} style={{ width: 36, height: 36, borderRadius: 7, border: `1px solid ${LINE}`, background: CARD, color: INK }}>+</button>
                  <button onClick={() => setObservation(i, 30)} style={{ padding: "9px 8px", borderRadius: 7, border: `1px solid ${Number(med.observationMin) === 30 ? SELECTED_GREEN : LINE}`, background: Number(med.observationMin) === 30 ? SELECTED_GREEN : CARD, color: Number(med.observationMin) === 30 ? "#FFF" : INK, fontSize: 11, fontWeight: 600 }}>30 min</button>
                  <button onClick={() => setObservation(i, 0)} style={{ padding: "9px 7px", borderRadius: 7, border: `1px solid ${LINE}`, background: CARD, color: MUTED, fontSize: 11 }}>Clear</button>
                </div>
              </div>
              <div style={{ marginTop: 12, marginLeft: 19 }}>
                <button onClick={() => setPostVitalsEnabled(i)} style={{ width: "100%", padding: "9px 8px", borderRadius: 7, border: `1px solid ${med.postVitalsEnabled ? SELECTED_GREEN : LINE}`, background: med.postVitalsEnabled ? SELECTED_GREEN : CARD, color: med.postVitalsEnabled ? "#FFF" : INK, fontSize: 12, fontWeight: 600 }}>Vitals Post?</button>
                {med.postVitalsEnabled && (
                  <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 8 }}>
                    <button onClick={() => setPostVitalsMin(i, Number(med.postVitalsMin || 30) - 5)} style={{ width: 36, height: 36, borderRadius: 7, border: `1px solid ${LINE}`, background: CARD, color: INK }}>-</button>
                    <input type="number" min="1" inputMode="numeric" value={med.postVitalsMin || 30} onChange={(e) => setPostVitalsMin(i, e.target.value)} aria-label={`${med.name} post-medication vitals in minutes`} style={{ width: 64, height: 36, borderRadius: 7, border: `1px solid ${LINE}`, textAlign: "center", fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, color: INK }} />
                    <button onClick={() => setPostVitalsMin(i, Number(med.postVitalsMin || 30) + 5)} style={{ width: 36, height: 36, borderRadius: 7, border: `1px solid ${LINE}`, background: CARD, color: INK }}>+</button>
                    <span style={{ fontSize: 12, color: MUTED }}>minutes after medication</span>
                  </div>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input ref={forwardedInputRef} value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); add(); } }}
          placeholder="e.g. Rituximab" style={{ flex: 1, fontSize: 14, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none" }} />
        <button onClick={add} style={{ height: 42, padding: "0 16px", borderRadius: 8, border: `1px solid ${ACCENT}`, color: ACCENT, background: CARD, fontSize: 14, fontWeight: 600 }}>Enter</button>
      </div>
    </div>
  );
}

function NewPatientForm({ existing, patient = null, onSave, onCancel }) {
  const [initials, setInitials] = useState(patient?.initials || "");
  const [type, setType] = useState(patient?.type || "chair");
  const [number, setNumber] = useState(patient?.number ?? "");
  const [regimenLabel, setRegimenLabel] = useState(patient?.regimenLabel || "");
  const [labs, setLabs] = useState(patient?.labs || []);
  const [premeds, setPremeds] = useState(patient?.premeds || []);
  const [todayMeds, setTodayMeds] = useState((patient?.todayMeds || []).map((med, index, all) => typeof med === "string" ? { name: med, filterRequired: patient?.filterRequired || false, durationMin: 0, observationMin: all.length === 1 ? patient?.observationMin || 0 : 0, vitalsSelections: patient?.vitalsSelections || [], postVitalsEnabled: false, postVitalsMin: 30 } : { ...med, durationMin: med.durationMin || 0, observationMin: med.observationMin ?? (all.length === 1 ? patient?.observationMin || 0 : 0), vitalsSelections: med.vitalsSelections || [], postVitalsEnabled: !!med.postVitalsEnabled, postVitalsMin: med.postVitalsMin || 30 }));
  const [premedWaitMin, setPremedWaitMin] = useState(patient?.premedWaitMin ?? 30);
  const [labsEntryPending, setLabsEntryPending] = useState(false);
  const [premedsEntryPending, setPremedsEntryPending] = useState(false);
  const numberRef = useRef(null);
  const regimenRef = useRef(null);
  const labsRef = useRef(null);
  const premedsRef = useRef(null);
  const medicationsRef = useRef(null);

  const usedNumbers = existing.filter((p) => p.type === type && p.id !== patient?.id).map((p) => p.number);
  const numberTaken = number !== "" && usedNumbers.includes(Number(number));
  const canSave = initials.trim().length > 0 && Number(number) > 0 && !numberTaken && todayMeds.length > 0;

  const save = () => {
    if (!canSave) return;
    onSave({
      ...(patient || {}), id: patient?.id || Date.now(), type, number: Number(number), initials: initials.trim().toUpperCase(),
      regimenLabel: regimenLabel.trim(), labs, premeds, todayMeds, observationMin: Math.max(0, ...todayMeds.map((med) => Number(med.observationMin) || 0)),
      premedWaitMin: premeds.length > 0 ? premedWaitMin : 0, stage: patient?.stage || "chart-review", notes: patient?.notes || [],
    });
  };

  return (
    <div onPointerDownCapture={(event) => {
      const editor = event.target.closest?.("[data-entry-editor]")?.dataset.entryEditor;
      if ((labsEntryPending && editor !== "labs") || (premedsEntryPending && editor !== "premeds")) {
        event.preventDefault();
        event.stopPropagation();
      }
    }} style={{ flex: 1, overflowY: "auto", padding: "20px 20px" }}>
      <div style={{ fontSize: 18, fontWeight: 600, color: INK, marginBottom: 16 }}>{patient ? "Edit Patient" : "New Patient"}</div>
      <FieldLabel>Initials</FieldLabel>
      <input autoFocus={!patient} maxLength="5" value={initials} onChange={(e) => setInitials(e.target.value.slice(0, 5))} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); numberRef.current?.focus(); numberRef.current?.select(); } }} placeholder="e.g. M.R."
        style={{ width: "100%", fontSize: 15, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none", marginBottom: 16 }} />

      <FieldLabel>Location</FieldLabel>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {["chair", "bed"].map((t) => (
          <button key={t} onClick={() => setType(t)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, textTransform: "capitalize",
            background: type === t ? ACCENT : CARD, color: type === t ? "#FFF" : INK, border: `1px solid ${type === t ? ACCENT : LINE}` }}>{t}</button>
        ))}
      </div>

      <FieldLabel>{type === "chair" ? "Chair" : "Bed"} number</FieldLabel>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
        <button onClick={() => setNumber(Math.max(1, (Number(number) || 1) - 1))} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>-</button>
        <input ref={numberRef} type="number" min="1" inputMode="numeric" value={number} onChange={(e) => setNumber(e.target.value === "" ? "" : Math.max(1, Number(e.target.value) || 1))} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); regimenRef.current?.focus(); } }}
          aria-label={`${type === "chair" ? "Chair" : "Bed"} number`}
          style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, width: 64, height: 40, textAlign: "center", color: INK, background: CARD, border: `1px solid ${LINE}`, borderRadius: 8 }} />
        <button onClick={() => setNumber((Number(number) || 0) + 1)} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>+</button>
      </div>
      {numberTaken ? <div style={{ fontSize: 12, marginBottom: 12, color: "#B0413E" }}>{locWord({ type })} {number} is already in use.</div> : <div style={{ marginBottom: 16 }} />}

      <FieldLabel>Regimen / treatment label (optional)</FieldLabel>
      <input ref={regimenRef} value={regimenLabel} onChange={(e) => setRegimenLabel(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); labsRef.current?.focus(); } }} placeholder="i.e. FOLFOX, Iron"
        style={{ width: "100%", fontSize: 15, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none", marginBottom: 16 }} />

      <FieldLabel>Labs (optional)</FieldLabel>
      <div style={{ marginBottom: 16 }}><OrderedListEditor items={labs} onChange={setLabs} placeholder="e.g. CBC, BMP, or UA" entryName="labs" onPendingChange={setLabsEntryPending} forwardedInputRef={labsRef} /></div>

      <FieldLabel>Premeds, in order given</FieldLabel>
      <div style={{ marginBottom: premeds.length > 0 ? 8 : 16 }}><OrderedListEditor items={premeds} onChange={setPremeds} placeholder="e.g. Diphenhydramine" entryName="premeds" onPendingChange={setPremedsEntryPending} forwardedInputRef={premedsRef} /></div>

      {premeds.length > 0 && (<>
        <FieldLabel>Premed wait time before infusing</FieldLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16 }}>
          <Stepper value={premedWaitMin} onChange={setPremedWaitMin} step={5} min={0} highlighted={premedWaitMin > 0} />
          <button onClick={() => setPremedWaitMin(30)} style={{ padding: "10px 10px", borderRadius: 8, border: `1px solid ${premedWaitMin === 30 ? SELECTED_GREEN : ACCENT}`, color: premedWaitMin === 30 ? "#FFF" : ACCENT, background: premedWaitMin === 30 ? SELECTED_GREEN : CARD, fontSize: 12, fontWeight: 600, whiteSpace: "nowrap" }}>30 min</button>
          <button onClick={() => setPremedWaitMin(0)} style={{ padding: "10px 9px", borderRadius: 8, border: `1px solid ${LINE}`, color: MUTED, background: CARD, fontSize: 12, fontWeight: 600 }}>Clear</button>
        </div>
      </>)}

      <FieldLabel>Today's Medications (Infusions &amp; Injections)</FieldLabel>
      <div style={{ marginBottom: 24 }}><MedicationListEditor items={todayMeds} onChange={setTodayMeds} forwardedInputRef={medicationsRef} /></div>

      <div style={{ display: "flex", gap: 8, paddingBottom: 16 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "12px 0", borderRadius: 8, fontSize: 15, fontWeight: 500, border: `1px solid ${LINE}`, color: MUTED, background: CARD }}>Cancel</button>
        <button onClick={save} disabled={!canSave} style={{ flex: 1, padding: "12px 0", borderRadius: 8, fontSize: 15, fontWeight: 500, background: canSave ? ACCENT : "#C9DAD3", color: "#FFF", border: "none" }}>{patient ? "Save patient" : "Add patient"}</button>
      </div>
      {!canSave && <div style={{ fontSize: 12, paddingBottom: 24, color: MUTED }}>Needs initials, an open {type} number, and at least one medication for today.</div>}
    </div>
  );
}

function SettingsScreen({ settings, onChange, onClose }) {
  const SettingRow = ({ label, description, field }) => (
    <label style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px", borderRadius: 10, background: CARD, border: `1px solid ${LINE}` }}>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: INK }}>{label}</div>
        <div style={{ marginTop: 3, fontSize: 12, lineHeight: 1.4, color: MUTED }}>{description}</div>
      </div>
      <input type="checkbox" checked={settings[field]} onChange={(e) => onChange(field, e.target.checked)} style={{ width: 22, height: 22 }} />
    </label>
  );
  return (
    <div style={{ flex: 1, padding: 20, background: PAPER }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <div style={{ fontSize: 20, fontWeight: 600, color: INK }}>Optional Settings</div>
        <button onClick={onClose} style={{ padding: "8px 14px", borderRadius: 8, border: `1px solid ${LINE}`, background: CARD, color: MUTED, fontSize: 14 }}>Done</button>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <SettingRow label="Alert sound" description="Play a short ping when any countdown reaches zero." field="sound" />
        <SettingRow label="Haptic feedback" description="Vibrate when supported by the phone and browser." field="haptics" />

}

function CompletedLibrary({ patients, onDelete, onClose }) {
  const vitalsLabel = (value) => value === "every30" ? "Every 30 min" : value === "end" ? "End" : `${value} min`;
  const medicationStatus = (run) => run.status === "complete" ? "Completed" : run.status === "stopped" ? "Stopped" : run.status === "running" ? "Running when archived" : "Not started";
  return (
    <div style={{ flex: 1, overflowY: "auto", padding: 20, background: PAPER }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18 }}>
        <div>
          <div style={{ fontSize: 20, fontWeight: 600, color: INK }}>Completed Library</div>
          <div style={{ marginTop: 3, fontSize: 12, color: MUTED }}>{patients.length} completed patient{patients.length === 1 ? "" : "s"}</div>
        </div>
        <button onClick={onClose} style={{ padding: "8px 14px", borderRadius: 8, border: `1px solid ${LINE}`, background: CARD, color: MUTED, fontSize: 14 }}>Done</button>
      </div>
      {patients.length === 0 ? (
        <div style={{ padding: 24, textAlign: "center", borderRadius: 10, border: `1px solid ${LINE}`, background: CARD, color: MUTED, fontSize: 14 }}>No completed patients yet.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {patients.slice().reverse().map((patient) => (
            <div key={patient.id} style={{ padding: 16, borderRadius: 10, border: `1px solid ${LINE}`, background: CARD }}>
              <div style={{ display: "flex", justifyContent: "space-between", gap: 12 }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 700, color: INK }}>{locWord(patient)} {patient.number} · {patient.initials}</div>
                  <div style={{ marginTop: 3, fontSize: 12, color: MUTED }}>Completed {patient.completedVisitAt ? new Date(patient.completedVisitAt).toLocaleString() : ""}</div>
                </div>
                <button onClick={() => onDelete(patient.id)} style={{ alignSelf: "flex-start", padding: "7px 10px", borderRadius: 7, border: "1px solid #E7B9B6", background: CARD, color: "#B0413E", fontSize: 12 }}>Delete</button>
              </div>
              {patient.regimenLabel && <div style={{ marginTop: 10, fontSize: 13, fontWeight: 600, color: INK }}>{patient.regimenLabel}</div>}
              <div style={{ marginTop: 12, padding: 12, borderRadius: 8, background: "#F4F6F5", border: `1px solid ${LINE}` }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: INK, marginBottom: 7 }}>Timer &amp; duration summary</div>
                <div style={{ fontSize: 12, lineHeight: 1.6, color: MUTED }}>
                  <div>Premed wait: {Number(patient.premedWaitMin) > 0 ? `${patient.premedWaitMin} min` : "None"}</div>
                  <div>Observation: {Number(patient.observationMin) > 0 ? `${patient.observationMin} min` : "None"}</div>
                  <div>Optional alert: {patient.customCountdown?.durationMin ? `${patient.customCountdown.durationMin} min (${patient.customCountdown.status || "saved"})` : "None"}</div>
                </div>
              </div>
              <div style={{ marginTop: 12 }}>
                <div style={{ fontSize: 12, fontWeight: 700, color: INK, marginBottom: 7 }}>Medications, infusions &amp; injections</div>
                {(patient.medicationRuns || (patient.todayMeds || []).map((med) => typeof med === "string" ? { name: med, status: "pending" } : med)).length ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {(patient.medicationRuns || (patient.todayMeds || []).map((med) => typeof med === "string" ? { name: med, status: "pending" } : med)).map((run, index) => (
                      <div key={`${run.name}-${index}`} style={{ padding: 10, borderRadius: 8, border: `1px solid ${LINE}`, background: CARD }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: INK }}>{index + 1}. {run.name}</div>
                        <div style={{ marginTop: 4, fontSize: 11, lineHeight: 1.55, color: MUTED }}>
                          <div>Status: {medicationStatus(run)}</div>
                          <div>Planned duration: {Number(run.durationMin) > 0 ? `${run.durationMin} min` : "Not specified"}</div>
                          <div>Actual timer: {Number(run.elapsedSeconds) > 0 ? mmss(Number(run.elapsedSeconds) / 60) : "Not recorded"}{run.startedAt ? ` · Started ${run.startedAt}` : ""}{run.completedAt ? ` · Completed ${run.completedAt}` : ""}</div>
                          <div>Vitals during: {(run.vitalsSelections || []).length ? run.vitalsSelections.map(vitalsLabel).join(", ") : "None"}</div>
                          <div>Vitals post: {run.postVitalsEnabled ? `${run.postVitalsMin || 30} min after medication` : "None"}</div>
                          <div>Observation after medication: {Number(run.observationMin) > 0 ? `${run.observationMin} min` : "None"}</div>
                          {run.observationTimer && <div>Observation timer: {run.observationTimer.remaining === 0 ? "Completed" : `${mmss(run.observationTimer.remaining || 0)} remaining`}</div>}
                          {(run.vitalsTimers || []).length > 0 && <div>Vitals timers: {run.vitalsTimers.map((timer) => `${timer.label}${timer.completedAt ? ` completed ${timer.completedAt}` : " not completed"}`).join("; ")}</div>}
                        </div>
                      </div>
                    ))}
                  </div>
                ) : <div style={{ fontSize: 12, color: MUTED }}>None</div>}
              </div>
              <div style={{ marginTop: 12, fontSize: 12, lineHeight: 1.6, color: MUTED }}>
                <div>Labs: {(patient.labs || []).join(", ") || "None"}</div>
                <div>Premeds: {(patient.premeds || []).join(", ") || "None"}</div>
                <div>Notes: {(patient.notes || []).length}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TabBar({ patients, activeId, onSelect, onAddTab, onLibrary, onSettings, libraryActive, settingsActive }) {
  return (
    <div style={{ position: "sticky", top: 0, zIndex: 50, flexShrink: 0, display: "flex", overflow: "hidden", background: CARD, borderBottom: `1px solid ${LINE}`, boxShadow: "0 2px 8px rgba(22, 38, 42, 0.08)" }}>
      <div style={{ flex: 1, minWidth: 0, display: "flex", overflowX: "auto", WebkitOverflowScrolling: "touch" }}>
        {patients.map((p) => {
        const isActive = p.id === activeId;
        const cfg = STAGES[p.stage];
        const needsAttention = !!p.timerAlert || !!p.premedAlert;
        const countdowns = activeCountdowns(p);
        return (
          <button key={p.id} onClick={() => onSelect(p.id)} style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2, flexShrink: 0,
            width: 78, height: 84, borderBottom: `3px solid ${isActive ? cfg.color : "transparent"}`, background: needsAttention ? "#FFF2CC" : "none", border: "none", borderBottomWidth: 3, borderBottomStyle: "solid", borderBottomColor: isActive ? cfg.color : "transparent",
            animation: needsAttention ? "premed-alert-pulse 1s ease-in-out infinite" : "none" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600, color: isActive ? INK : MUTED }}>{locLabel(p)}</span>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: isActive ? INK : MUTED }}>{p.initials}</span>
            <span style={{ minHeight: 20, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", lineHeight: 1.05 }}>
              {countdowns.slice(0, 2).map((timer, index) => <span key={`${timer.label}-${index}`} className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, fontWeight: 600, color: needsAttention ? "#9A5B00" : SELECTED_GREEN }}>{timer.label} {mmss(timer.remaining)}</span>)}
              {countdowns.length > 2 && <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 8, color: MUTED }}>+{countdowns.length - 2} more</span>}
            </span>
            <span style={{ width: 6, height: 6, borderRadius: 999, background: cfg.color }} />
          </button>
        );
        })}
        <button onClick={onAddTab} style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, flexShrink: 0, width: 66, height: 84, background: "none", border: "none", borderBottom: `3px solid ${activeId === "new" ? ACCENT : "transparent"}` }}>
          <IconPlus size={18} color={activeId === "new" ? ACCENT : MUTED} />
        </button>
      </div>
      <div style={{ display: "flex", flexShrink: 0, background: CARD, borderLeft: `1px solid ${LINE}` }}>
        <button onClick={onLibrary} aria-label="Completed patient library" style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 48, height: 84, background: libraryActive ? "#EEF1F0" : "none", border: "none" }}>
          <IconNotebook size={20} color={libraryActive ? ACCENT : MUTED} />
        </button>
        <button onClick={onSettings} aria-label="Optional settings" style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 48, height: 84, background: settingsActive ? "#EEF1F0" : "none", border: "none" }}>
          <IconGear size={20} color={settingsActive ? ACCENT : MUTED} />
        </button>
      </div>
    </div>
  );
}

function ChecklistGate({ items, checked, onToggle, onSelectAll }) {
  return (
    <div style={{ marginTop: 16, borderRadius: 10, padding: 16, background: "#F7F5FB", border: "1px solid #E1D9F2" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
        <IconShield size={14} color="#6E5AA3" />
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textTransform: "uppercase", letterSpacing: "0.04em", color: "#6E5AA3" }}>Confirm before continuing</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {items.map((item, i) => item ? (
          <label key={i} style={{ display: "flex", alignItems: "flex-start", gap: 12, fontSize: 15, lineHeight: 1.4, color: INK, cursor: "pointer" }}>
            <input type="checkbox" checked={!!checked[i]} onChange={() => onToggle(i)} style={{ width: 20, height: 20, marginTop: 2, flexShrink: 0 }} />
            <span>{item}</span>
          </label>
        ) : null)}
      </div>
      {onSelectAll && (
        <button onClick={() => onSelectAll(true)} style={{ width: "100%", marginTop: 16, padding: "11px 0", borderRadius: 8, border: `1px solid ${SELECTED_GREEN}`, background: items.every((item, index) => !item || checked[index]) ? SELECTED_GREEN : CARD, color: items.every((item, index) => !item || checked[index]) ? "#FFF" : SELECTED_GREEN, fontSize: 14, fontWeight: 600 }}>
          Select all
        </button>
      )}
    </div>
  );
}

function PreInfusionChecklist({ patient, checked, onToggle, onCheckAll, onStartPremedTimer }) {
  const labs = patient.labs || [];
  const premeds = patient.premeds || [];
  const items = buildPreInfusionChecklist(patient);
  const [timerMinutes, setTimerMinutes] = useState(patient.premedWaitMin || 30);
  const allChecked = items.length > 0 && items.every((_, index) => checked[index]);
  const renderChecks = (entries, offset) => entries.length ? entries.map((label, index) => (
    <label key={`${offset}-${index}`} style={{ display: "flex", alignItems: "flex-start", gap: 12, fontSize: 15, lineHeight: 1.4, color: INK, cursor: "pointer" }}>
      <input type="checkbox" checked={!!checked[offset + index]} onChange={() => onToggle(offset + index)} style={{ width: 20, height: 20, marginTop: 2, flexShrink: 0 }} />
      <span>{label}</span>
    </label>
  )) : <div style={{ fontSize: 13, color: MUTED }}>None specified</div>;
  const drawnLabels = labs;
  const premedLabels = premeds.map((med) => `${med} given`);
  const otherOffset = 1 + labs.length + premeds.length;
  const otherItems = items.slice(otherOffset);
  return (
    <div style={{ marginTop: 16, borderRadius: 10, padding: 16, background: "#F7F5FB", border: "1px solid #E1D9F2" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 16 }}>
        <IconShield size={14} color="#6E5AA3" />
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textTransform: "uppercase", letterSpacing: "0.04em", color: "#6E5AA3" }}>Confirm before continuing</span>
      </div>
      <label style={{ display: "flex", alignItems: "center", gap: 12, fontSize: 15, fontWeight: 700, color: INK, marginBottom: 18, cursor: "pointer" }}>
        <input type="checkbox" checked={!!checked[0]} onChange={() => onToggle(0)} style={{ width: 20, height: 20, flexShrink: 0 }} />
        Required Labs Checked
      </label>
      <div style={{ fontSize: 15, fontWeight: 700, color: INK, marginBottom: 10 }}>Labs Drawn</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>{renderChecks(drawnLabels, 1)}</div>
      <div style={{ fontSize: 15, fontWeight: 700, color: INK, marginBottom: 10 }}>Premeds Given</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: premeds.length ? 14 : 18 }}>{renderChecks(premedLabels, 1 + labs.length)}</div>
      {premeds.length > 0 && (
        <div style={{ marginBottom: 18, padding: 12, borderRadius: 8, background: CARD, border: `1px solid ${LINE}` }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: INK, marginBottom: 10 }}>Premed timer</div>
          <Stepper value={timerMinutes} onChange={setTimerMinutes} step={5} min={0} />
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <button onClick={() => setTimerMinutes(30)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${ACCENT}`, background: CARD, color: ACCENT, fontWeight: 600 }}>30 min</button>
            <button onClick={() => onStartPremedTimer(timerMinutes)} style={{ flex: 2, padding: "10px 0", borderRadius: 8, border: "none", background: ACCENT, color: "#FFF", fontWeight: 600 }}>{patient.premedTimerStarted ? "Restart premed timer" : "Start premed timer"}</button>
          </div>
          {patient.premedTimerStarted && <div style={{ marginTop: 8, fontSize: 12, color: MUTED }}>Timer running · {mmss(patient.remaining || 0)} remaining</div>}
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>{renderChecks(otherItems, otherOffset)}</div>
      <label style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 18, paddingTop: 14, borderTop: `1px solid ${LINE}`, fontSize: 14, fontWeight: 600, color: INK }}>
        <input type="checkbox" checked={allChecked} onChange={(e) => onCheckAll(e.target.checked)} style={{ width: 20, height: 20 }} />
        Check all
      </label>
    </div>
  );
}

function NotesSection({ notes, onAdd }) {
  const [draft, setDraft] = useState("");
  const { listening, supported, start, stop } = useVoiceInput(onAdd);
  const submit = () => { if (!draft.trim()) return; onAdd(draft.trim()); setDraft(""); };
  return (
    <div style={{ marginTop: 20 }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", color: MUTED, marginBottom: 8 }}>Notes</div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Add a note..."
          style={{ flex: 1, fontSize: 15, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none" }} />
        <button onClick={submit} style={{ borderRadius: 8, border: `1px solid ${LINE}`, color: MUTED, width: 42, height: 42, flexShrink: 0, background: CARD, display: "flex", alignItems: "center", justifyContent: "center" }}><IconPlus size={18} /></button>
        <button onClick={listening ? stop : start} style={{ borderRadius: 8, border: `1px solid ${listening ? "#B0413E" : LINE}`, color: listening ? "#B0413E" : MUTED, background: listening ? "#FBEAE9" : CARD, width: 42, height: 42, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {supported ? <IconMic size={18} /> : <IconMicOff size={18} />}
        </button>
      </div>
      {!supported && <div style={{ fontSize: 11, marginTop: 6, color: MUTED }}>Voice input isn\u2019t supported in this browser \u2014 works in Safari/Chrome with mic permission granted.</div>}
      {notes.length > 0 && (
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
          {notes.slice().reverse().map((n, i) => (
            <div key={i} style={{ fontSize: 13, color: MUTED }}><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{n.t}</span> \u2014 {n.text}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function VitalsTimers({ timers, onComplete }) {
  if (!timers?.length) return null;
  return (
    <div style={{ marginTop: 18 }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", color: MUTED, marginBottom: 8 }}>Vitals</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 8 }}>
        {timers.map((timer, index) => {
          const urgent = timer.remaining !== null && timer.remaining <= 3 && !timer.completedAt;
          return (
            <button key={timer.key} onClick={() => onComplete(index)} style={{ padding: "10px", textAlign: "left", borderRadius: 8, background: timer.completedAt ? "#E8F3EE" : urgent ? "#FBEAE9" : CARD, border: `1px solid ${timer.completedAt ? "#A8D0BC" : urgent ? "#E7B9B6" : LINE}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: timer.completedAt ? "#3B7A57" : urgent ? "#B0413E" : INK }}>{timer.label}</div>
              <div className="tabular-nums" style={{ marginTop: 4, fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, color: INK }}>{timer.completedAt ? `Done ${timer.completedAt}` : timer.dueAt ? mmss(timer.remaining || 0) : "At end"}</div>
              {timer.recurring && !timer.completedAt && <div style={{ marginTop: 2, fontSize: 10, color: MUTED }}>Tap when checked · resets 30 min</div>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function CustomCountdown({ timer, onStart, onClear }) {
  const [duration, setDuration] = useState(5);
  const running = timer?.status === "running";
  const complete = timer?.status === "complete";
  return (
    <div style={{ marginTop: 16, padding: 14, borderRadius: 10, background: CARD, border: `1px solid ${LINE}` }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", color: MUTED, marginBottom: 8 }}>Optional alert timer</div>
      {!running && !complete ? (
        <div>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button onClick={() => onStart(30)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${ACCENT}`, background: CARD, color: ACCENT, fontSize: 14, fontWeight: 600 }}>30 min</button>
            <button onClick={() => onStart(60)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1px solid ${ACCENT}`, background: CARD, color: ACCENT, fontSize: 14, fontWeight: 600 }}>60 min</button>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input type="number" min="1" inputMode="numeric" value={duration} onChange={(e) => setDuration(Math.max(1, Number(e.target.value) || 1))} aria-label="Alert timer duration in minutes"
              style={{ width: 72, height: 40, padding: "0 8px", borderRadius: 8, border: `1px solid ${LINE}`, fontFamily: "'IBM Plex Mono', monospace", fontSize: 16, textAlign: "center", color: INK }} />
            <span style={{ fontSize: 13, color: MUTED }}>minutes</span>
            <button onClick={() => onStart(duration)} style={{ marginLeft: "auto", height: 40, padding: "0 14px", borderRadius: 8, border: "none", background: ACCENT, color: "#FFF", fontSize: 14, fontWeight: 500 }}>Start alert</button>
          </div>
        </div>
      ) : (
        <div>
          <div className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 32, color: complete ? "#B0413E" : INK }}>{mmss(timer.remaining || 0)}</div>
          <div style={{ marginTop: 4, fontSize: 12, color: complete ? "#B0413E" : MUTED }}>{complete ? "Alert reached" : `Alert after ${timer.durationMin} min`}</div>
          <button onClick={onClear} style={{ marginTop: 10, width: "100%", padding: "9px 0", borderRadius: 8, border: `1px solid ${LINE}`, background: CARD, color: MUTED, fontSize: 13 }}>{complete ? "Clear timer" : "Cancel timer"}</button>
        </div>
      )}
    </div>
  );
}

function MedicationTimers({ p, onToggleMedicationCheck, onStartMedication, onResetMedication, onCompleteMedication, onCompleteMedicationVitals }) {
  const medications = (p.todayMeds || []).map((entry) => typeof entry === "string" ? { name: entry, filterRequired: false } : entry);
  const runs = p.medicationRuns || medications.map((med) => ({ ...med, orderConfirmed: false, filterReady: false, status: "pending", elapsedSeconds: 0 }));
  return (
    <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 16 }}>
      {runs.map((run, index) => {
        const readyToStart = run.orderConfirmed && (!run.filterRequired || run.filterReady);
        const hasPrescribedDuration = Number(run.durationMin) > 0;
        const timerValue = run.status === "pending" && hasPrescribedDuration
          ? Number(run.durationMin)
          : run.status === "running" && hasPrescribedDuration
            ? (run.remainingMin ?? Number(run.durationMin))
            : (run.elapsedSeconds || 0) / 60;
        const timerLabel = run.status === "complete" ? "completed"
          : run.status === "pending" && hasPrescribedDuration ? "prescribed"
          : run.status === "running" && hasPrescribedDuration ? "remaining"
          : run.status === "running" ? "elapsed" : "ready";
        return (
          <div key={`${run.name}-${index}`} style={{ padding: 16, borderRadius: 12, background: run.status === "complete" ? "#EEF1EF" : CARD, border: `1px solid ${run.status === "running" ? ACCENT : LINE}`, opacity: run.status === "complete" ? 0.68 : 1 }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: MUTED, textTransform: "uppercase", marginBottom: 4 }}>Medication {index + 1} of {runs.length}{run.status === "running" ? " · Running" : ""}</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: INK, marginBottom: 12 }}>{run.name}</div>
            <label style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, fontSize: 14, color: INK }}>
              <input type="checkbox" checked={!!run.orderConfirmed} disabled={run.status !== "pending"} onChange={(e) => onToggleMedicationCheck(index, "orderConfirmed", e.target.checked)} />
              Medication order confirmed: {run.name}
            </label>
            {run.filterRequired && (
              <label style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, fontSize: 14, color: INK }}>
                <input type="checkbox" checked={!!run.filterReady} disabled={run.status !== "pending"} onChange={(e) => onToggleMedicationCheck(index, "filterReady", e.target.checked)} />
                Filter ready: {run.name}
              </label>
            )}
            <div style={{ marginTop: 10, fontSize: 12, color: MUTED }}>Planned duration: {Number(run.durationMin) > 0 ? `${run.durationMin} min` : "not specified"}</div>
            <div style={{ marginTop: 4, fontSize: 12, color: MUTED }}>Vitals during: {(run.vitalsSelections || []).length ? run.vitalsSelections.map((value) => value === "every30" ? "Every 30" : value === "end" ? "End" : `${value} min`).join(", ") : "none specified"}</div>
            <div style={{ marginTop: 4, fontSize: 12, color: MUTED }}>Vitals post: {run.postVitalsEnabled ? `${run.postVitalsMin || 30} min after medication` : "none specified"}</div>
            <div style={{ marginTop: 4, fontSize: 12, color: MUTED }}>Observation after medication: {Number(run.observationMin) > 0 ? `${run.observationMin} min` : "none specified"}</div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 14 }}>
              <IconClock size={16} color={MUTED} />
              <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 28, color: run.status === "running" && hasPrescribedDuration && run.remainingMin === 0 ? "#B0413E" : INK }}>{mmss(timerValue)}</span>
              <span style={{ fontSize: 12, color: MUTED }}>{timerLabel}</span>
            </div>
            {run.status === "running" && hasPrescribedDuration && run.remainingMin === 0 && (
              <div style={{ marginTop: 4, fontSize: 13, fontWeight: 600, color: run.remainingMin === 0 ? "#B0413E" : ACCENT }}>
                Planned duration reached
              </div>
            )}
            {run.vitalsTimers?.length > 0 && <VitalsTimers timers={run.vitalsTimers} onComplete={(timerIndex) => onCompleteMedicationVitals(index, timerIndex)} />}
            {run.status === "pending" && (
              <button onClick={() => onStartMedication(index)} disabled={!readyToStart} style={{ width: "100%", marginTop: 12, padding: "12px 0", borderRadius: 8, border: "none", background: readyToStart ? ACCENT : "#C9DAD3", color: "#FFF", fontSize: 15, fontWeight: 500 }}>Start infusion</button>
            )}
            {run.status === "running" && (
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button onClick={() => onResetMedication(index)} style={{ flex: 1, padding: "12px 0", borderRadius: 8, border: `1px solid ${LINE}`, background: CARD, color: MUTED, fontSize: 14, fontWeight: 500 }}>Undo Start</button>
                <button onClick={() => onCompleteMedication(index)} style={{ flex: 2, padding: "12px 0", borderRadius: 8, border: "none", background: "#3B7A57", color: "#FFF", fontSize: 15, fontWeight: 500 }}>Complete Medication</button>
              </div>
            )}
            {run.status === "complete" && <div style={{ marginTop: 8, fontSize: 12, color: MUTED }}>Completed at {run.completedAt} · Duration {mmss((run.elapsedSeconds || 0) / 60)}</div>}
          </div>
        );
      })}
    </div>
  );
}

function MedicationObservationTimers({ p }) {
  const runs = (p.medicationRuns || []).filter((run) => Number(run.observationMin) > 0);
  return (
    <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 10 }}>
      {runs.map((run, index) => {
        const timer = run.observationTimer;
        const complete = timer && timer.remaining === 0;
        return (
          <div key={`${run.name}-${index}`} style={{ padding: 16, borderRadius: 10, background: complete ? "#E8F3EE" : CARD, border: `1px solid ${complete ? "#A8D0BC" : LINE}` }}>
            <div style={{ fontSize: 14, fontWeight: 600, color: INK }}>{run.name}</div>
            <div className="tabular-nums" style={{ marginTop: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 30, color: complete ? SELECTED_GREEN : INK }}>{mmss(timer?.remaining ?? Number(run.observationMin))}</div>
            <div style={{ marginTop: 3, fontSize: 12, color: MUTED }}>{complete ? "Observation complete" : `${run.observationMin} min observation after medication`}</div>
          </div>
        );
      })}
    </div>
  );
}

function BayScreen({ p, checked, onToggleCheck, onCheckAll, onStartPremedTimer, onSetPortAccess, onAddNote, onDelete, onCompletePatient, onStartCustomCountdown, onClearCustomCountdown, onToggleMedicationCheck, onStartMedication, onResetMedication, onCompleteMedication, onCompleteMedicationVitals }) {
  const cfg = STAGES[p.stage];
  const isGated = !!cfg.gate;
  const gateItems = cfg.gate === "GENERAL" ? GENERAL_CHECKLIST : cfg.gate === "PREINFUSION" ? buildPreInfusionChecklist(p) : cfg.gate === "DISCHARGE" ? DISCHARGE_CHECKLIST : [];

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px", borderTop: `4px solid ${cfg.color}` }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
        <div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.05em", color: MUTED }}>{locWord(p).toUpperCase()} {p.number}</div>
          <div style={{ fontSize: 20, fontWeight: 600, marginTop: 2, color: INK }}>{p.initials}</div>
        </div>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textTransform: "uppercase", letterSpacing: "0.04em", padding: "4px 10px", borderRadius: 999, color: cfg.color, background: `${cfg.color}1A` }}>{cfg.label}</span>
      </div>

      {p.regimenLabel && <div style={{ fontSize: 14, marginTop: 4, color: MUTED }}>{p.regimenLabel}</div>}

      {p.stage === "infusing" && <MedicationTimers p={p} onToggleMedicationCheck={onToggleMedicationCheck} onStartMedication={onStartMedication} onResetMedication={onResetMedication} onCompleteMedication={onCompleteMedication} onCompleteMedicationVitals={onCompleteMedicationVitals} />}
      {p.stage === "infusing" && <CustomCountdown key={p.id} timer={p.customCountdown} onStart={onStartCustomCountdown} onClear={onClearCustomCountdown} />}
      {p.stage === "observation" && <MedicationObservationTimers p={p} />}

      {cfg.timer && p.stage !== "observation" && (
        <div style={{ marginTop: 24, display: "flex", alignItems: "baseline", gap: 8 }}>
          <IconClock size={18} color={MUTED} />
          <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 48, color: INK }}>{mmss(p.remaining)}</span>
          <span style={{ fontSize: 12, color: MUTED }}>wait remaining</span>
        </div>
      )}
      {cfg.countUp && (
        <div style={{ marginTop: 24, display: "flex", alignItems: "baseline", gap: 8 }}>
          <IconClock size={18} color={MUTED} />
          <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 48, color: INK }}>{mmss(p.elapsed)}</span>
          <span style={{ fontSize: 12, color: MUTED }}>elapsed</span>
        </div>
      )}
      {cfg.countUp && <div style={{ fontSize: 12, marginTop: 4, color: MUTED }}>Pump manages actual completion \u2014 for your reference only.</div>}

      {p.stage === "complete" && (
        <div style={{ marginTop: 24, padding: 18, borderRadius: 10, background: CARD, border: `1px solid ${LINE}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <IconCheck size={20} color={cfg.color} />
            <span style={{ fontSize: 15, color: INK }}>Visit complete. Save this patient to free the chair.</span>
          </div>
          <button onClick={onCompletePatient} style={{ width: "100%", marginTop: 16, padding: "13px 0", borderRadius: 8, border: "none", background: SELECTED_GREEN, color: "#FFF", fontSize: 15, fontWeight: 700 }}>Complete Patient</button>
        </div>
      )}

      {p.stage === "pre-infusion-check" ? (
        <PreInfusionChecklist patient={p} checked={checked} onToggle={onToggleCheck} onCheckAll={onCheckAll} onStartPremedTimer={onStartPremedTimer} />
      ) : isGated ? <ChecklistGate items={gateItems} checked={checked} onToggle={onToggleCheck} onSelectAll={p.stage === "chart-review" || p.stage === "discharge-check" ? onCheckAll : null} /> : null}
      {p.stage === "chart-review" && (
        <div style={{ marginTop: 12, padding: 16, borderRadius: 10, background: CARD, border: `1px solid ${LINE}` }}>
          <div style={{ fontSize: 15, fontWeight: 500, color: INK, marginBottom: 10 }}>Port access?</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[{ label: "Yes", value: true }, { label: "No", value: false }].map((option) => {
              const selected = p.portAccess === option.value;
              return <button key={option.label} onClick={() => onSetPortAccess(option.value)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, background: selected ? ACCENT : CARD, color: selected ? "#FFF" : INK, border: `1px solid ${selected ? ACCENT : LINE}` }}>{option.label}</button>;
            })}
          </div>
        </div>
      )}
      <NotesSection notes={p.notes} onAdd={onAddNote} />
      {p.stage !== "complete" && (
        <button onClick={onDelete} style={{ marginTop: 24, width: "100%", padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, color: "#B0413E", background: CARD, border: "1px solid #E7B9B6" }}>
          Delete patient
        </button>
      )}
    </div>
  );
}

function BottomBar({ p, checked, onAdvance, onRetreat, onBackToNew, onGateContinue }) {
  if (!p) return null;
  const cfg = STAGES[p.stage];
  const nextStage = nextStageFor(p);
  const previousStage = previousStageFor(p);
  const isGated = !!cfg.gate;
  const gateItems = isGated ? (cfg.gate === "GENERAL" ? GENERAL_CHECKLIST : cfg.gate === "PREINFUSION" ? buildPreInfusionChecklist(p) : DISCHARGE_CHECKLIST) : [];
  const allDone = gateItems.every((item, i) => !item || checked[i]) &&
    (p.stage !== "chart-review" || typeof p.portAccess === "boolean") &&
    (p.stage !== "pre-infusion-check" || !(p.premeds || []).length || p.premedTimerStarted);
  const allMedicationsComplete = p.stage !== "infusing" || ((p.medicationRuns || []).length > 0 && p.medicationRuns.every((run) => run.status === "complete"));
  return (
    <div style={{ display: "flex", gap: 8, padding: "12px 20px", borderTop: `1px solid ${LINE}`, background: CARD }}>
      {(previousStage || p.stage === "chart-review") && (
        <button onClick={previousStage ? onRetreat : onBackToNew} style={{ flex: 1, fontSize: 15, fontWeight: 500, padding: "14px 0", borderRadius: 10, background: CARD, color: MUTED, border: `1px solid ${LINE}` }}>
          {previousStage ? `Back to: ${STAGES[previousStage].label}` : "Back to New Patient"}
        </button>
      )}
      {nextStage && (
        <button onClick={isGated ? onGateContinue : onAdvance} disabled={(isGated && !allDone) || !allMedicationsComplete} style={{ flex: 1, fontSize: 15, fontWeight: 500, padding: "14px 0", borderRadius: 10, background: (isGated && !allDone) || !allMedicationsComplete ? "#DCD5EA" : cfg.color, color: "#FFF", border: "none" }}>
          {!allMedicationsComplete ? "Complete all medications to continue" : isGated ? (allDone ? "Confirmed \u2014 continue" : p.stage === "pre-infusion-check" && (p.premeds || []).length && !p.premedTimerStarted ? "Start premed timer to continue" : "Check all items to continue") : `Advance to: ${STAGES[nextStage].label}`}
        </button>
      )}
    </div>
  );
}

function loadPatients() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw).map((savedPatient) => {
      const patient = savedPatient.stage === "waiting" || savedPatient.stage === "access" ? { ...savedPatient, stage: "chart-review" } : { ...savedPatient };
      if ((STAGES[patient.stage]?.timer || patient.premedTimerStarted) && patient.timerEndsAt) {
        patient.remaining = Math.max(0, (patient.timerEndsAt - Date.now()) / 60000);
        if (patient.remaining === 0 && !patient.stageTimerAlerted) {
          patient.timerAlert = true;
          patient.stageTimerAlerted = true;
        }
      } else if (STAGES[patient.stage]?.timer && patient.remaining > 0) {
        patient.timerEndsAt = Date.now() + patient.remaining * 60000;
      }
      if (!patient.vitalsSelections) patient.vitalsSelections = patient.vitalsIntervalMin === 15 ? ["15"] : patient.vitalsIntervalMin === 30 ? ["every30"] : [];
      if (patient.stage === "infusing" && !patient.vitalsTimers) patient.vitalsTimers = buildVitalsTimers(patient.vitalsSelections);
      if (patient.vitalsTimers) patient.vitalsTimers = patient.vitalsTimers.map((timer) => {
        if (!timer.dueAt || timer.completedAt) return timer;
        const remaining = Math.max(0, (timer.dueAt - Date.now()) / 60000);
        if (remaining === 0 && !timer.alerted) {
          patient.timerAlert = true;
          return { ...timer, remaining, alerted: true };
        }
        return { ...timer, remaining };
      });
      if (patient.customCountdown?.status === "running") {
        const remaining = Math.max(0, (patient.customCountdown.endsAt - Date.now()) / 60000);
        patient.customCountdown = { ...patient.customCountdown, remaining };
        if (remaining === 0 && !patient.customCountdown.alerted) {
          patient.customCountdown = { ...patient.customCountdown, status: "complete", alerted: true };
          patient.timerAlert = true;
        }
      }
      if (patient.stage === "infusing" && !patient.medicationRuns) {
        const medications = (patient.todayMeds || []).map((entry) => typeof entry === "string" ? { name: entry, filterRequired: false } : entry);
        patient.medicationRuns = medications.map((med) => ({ ...med, durationMin: med.durationMin || 0, vitalsSelections: med.vitalsSelections || [], postVitalsEnabled: !!med.postVitalsEnabled, postVitalsMin: med.postVitalsMin || 30, orderConfirmed: false, filterReady: false, status: "pending", elapsedSeconds: 0 }));
        patient.currentMedicationIndex = 0;
      }
      if (patient.medicationRuns) patient.medicationRuns = patient.medicationRuns.map((run, index) => {
        const medication = typeof patient.todayMeds?.[index] === "string" ? {} : patient.todayMeds?.[index] || {};
        let updated = { ...medication, ...run, durationMin: run.durationMin ?? medication.durationMin ?? 0, vitalsSelections: run.vitalsSelections || medication.vitalsSelections || [], postVitalsEnabled: run.postVitalsEnabled ?? medication.postVitalsEnabled ?? false, postVitalsMin: run.postVitalsMin ?? medication.postVitalsMin ?? 30 };
        if (updated.status === "running" && !updated.startedAtMs) updated.startedAtMs = Date.now() - (updated.elapsedSeconds || 0) * 1000;
        if (updated.status === "running" && Number(updated.durationMin) > 0) {
          updated.expectedEndsAt = updated.expectedEndsAt || updated.startedAtMs + Number(updated.durationMin) * 60000;
          updated.remainingMin = Math.max(0, (updated.expectedEndsAt - Date.now()) / 60000);

}

            <BayScreen p={activePatient} checked={activeChecked} onToggleCheck={(i) => onToggleCheck(activeId, activePatient.stage, i)} onCheckAll={(value) => onCheckAll(activeId, activePatient.stage, value)} onStartPremedTimer={(minutes) => onStartPremedTimer(activeId, minutes)} onSetPortAccess={(value) => onSetPortAccess(activeId, value)} onAddNote={(text) => onAddNote(activeId, text)} onDelete={() => onDeletePatient(activeId)} onCompletePatient={() => onCompletePatient(activeId)} onStartCustomCountdown={(duration) => onStartCustomCountdown(activeId, duration)} onClearCustomCountdown={() => onClearCustomCountdown(activeId)}
              onToggleMedicationCheck={(index, field, checked) => onToggleMedicationCheck(activeId, index, field, checked)} onStartMedication={(index) => onStartMedication(activeId, index)} onResetMedication={(index) => onResetMedication(activeId, index)} onCompleteMedication={(index) => onCompleteMedication(activeId, index)} onCompleteMedicationVitals={(medicationIndex, timerIndex) => onCompleteMedicationVitals(activeId, medicationIndex, timerIndex)} />
            <BottomBar p={activePatient} checked={activeChecked} onAdvance={() => onAdvance(activeId)} onRetreat={() => onRetreat(activeId)} onBackToNew={() => { setEditingId(activeId); setActiveId("new"); }} onGateContinue={() => onGateContinue(activeId)} />
          </>
        ) : (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12, color: MUTED }}>
            <IconDoor size={32} />
            <div style={{ fontSize: 14 }}>No patients yet \u2014 tap + to add one</div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
