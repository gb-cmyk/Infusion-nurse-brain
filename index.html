<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Chair Board" />
<meta name="theme-color" content="#F4F6F4" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Chair Board</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<style>
  html, body { margin: 0; padding: 0; background: #E7E9E7; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
  input[type="checkbox"] { accent-color: #6E5AA3; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  ::-webkit-scrollbar { display: none; }
  @keyframes premed-alert-pulse {
    0%, 100% { background: #FFF2CC; box-shadow: inset 0 0 0 2px #C98A2C; }
    50% { background: #FFD978; box-shadow: inset 0 0 0 3px #C98A2C; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env" data-plugins="transform-react-jsx">
const { useState, useEffect, useCallback, useRef } = React;

// ---- tiny inline icon set (no external icon package needed) ----------
function Icon({ children, size = 16, color = "currentColor", style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
      {children}
    </svg>
  );
}
const IconClock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
const IconMic = (p) => <Icon {...p}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></Icon>;
const IconMicOff = (p) => <Icon {...p}><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></Icon>;
const IconDoor = (p) => <Icon {...p}><path d="M13 4v16"/><path d="M3 20V6a2 2 0 0 1 2-2h8v18H5a2 2 0 0 1-2-2z"/><path d="M17 12h4"/></Icon>;
const IconShield = (p) => <Icon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></Icon>;
const IconPlus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const IconX = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const IconUp = (p) => <Icon {...p}><polyline points="18 15 12 9 6 15"/></Icon>;
const IconDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
const IconUser = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></Icon>;

// ---- tokens ----------------------------------------------------------
const INK = "#16262A";
const PAPER = "#F4F6F4";
const CARD = "#FFFFFF";
const LINE = "#DDE3E0";
const MUTED = "#5B6B6E";
const ACCENT = "#2E7D6B";
const PHONE_W = 430;
const STORAGE_KEY = "chairboard_patients_v1";
const CHECKED_STORAGE_KEY = "chairboard_checklists_v1";

const STAGES = {
  "chart-review": { label: "Chart Review", color: "#4C6FA3", previous: null, next: "premed-wait", gate: "GENERAL" },
  "premed-wait": { label: "Premed Wait", color: "#C98A2C", previous: "chart-review", next: "pre-infusion-check", timer: true },
  "pre-infusion-check": { label: "Pre-Infusion Check", color: "#6E5AA3", previous: "premed-wait", next: "infusing", gate: "PREINFUSION" },
  infusing: { label: "Infusing \u00b7 pump-timed", color: "#2E7D6B", previous: "pre-infusion-check", next: "observation", vitals: true },
  observation: { label: "Observation", color: "#8A5FBF", previous: "infusing", next: "discharge-check", timer: true, vitals: true },
  "discharge-check": { label: "End-of-Visit Check", color: "#3B7A57", previous: "observation", next: "complete", gate: "DISCHARGE" },
  complete: { label: "Complete", color: "#3B7A57", previous: "discharge-check", next: null },
};

const GENERAL_CHECKLIST = ["Allergies reviewed", "Current labs reviewed (CBC, CMP)", "Labs released?", "All Therapy Plans Reviewed", "Consent", null, "Patient assessment"];
const DISCHARGE_CHECKLIST = [
  "Next appointment scheduled",
  "IV site documented (removal, condition)",
  "MAR reviewed \u2014 all administered meds charted",
  "Final vital signs completed",
  "Charges captured for medications given",
];

function buildPreInfusionChecklist(patient) {
  const items = [];
  (patient.labs || []).forEach((lab) => {
    items.push(`Labs reviewed: ${lab}`);
    items.push(`Labs drawn: ${lab}`);
  });
  patient.premeds.forEach((m) => items.push(`${m} given`));
  items.push("Name tag");
  items.push("Labeled bags");
  items.push("Rate and order match chart");
  return items;
}

function mmss(min) {
  const m = Math.max(0, Math.floor(min));
  const s = Math.max(0, Math.round((min - m) * 60));
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function buildVitalsTimers(selections, startMs = Date.now()) {
  return (selections || []).map((selection) => {
    if (selection === "15") return { key: "15", label: "Vitals at 15 min", dueAt: startMs + 15 * 60000, remaining: 15, recurring: false };
    if (selection === "30") return { key: "30", label: "Vitals at 30 min", dueAt: startMs + 30 * 60000, remaining: 30, recurring: false };
    if (selection === "every30") return { key: "every30", label: "Vitals every 30 min", dueAt: startMs + 30 * 60000, remaining: 30, recurring: true };
    return { key: "end", label: "Vitals at end", dueAt: null, remaining: null, recurring: false };
  });
}
function locLabel(p) { return `${p.type === "chair" ? "C" : "B"}${p.number}`; }
function locWord(p) { return p.type === "chair" ? "Chair" : "Bed"; }

function useVoiceInput(onResult) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const recRef = useRef(null);
  const start = useCallback(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const rec = new SR();
    rec.continuous = false;
    rec.interimResults = false;
    rec.lang = "en-US";
    rec.onresult = (e) => onResult(e.results[0][0].transcript);
    rec.onend = () => setListening(false);
    rec.onerror = () => setListening(false);
    recRef.current = rec;
    try { rec.start(); setListening(true); } catch { setListening(false); }
  }, [onResult]);
  const stop = useCallback(() => { recRef.current?.stop(); setListening(false); }, []);
  return { listening, supported, start, stop };
}

function FieldLabel({ children }) {
  return <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", color: MUTED, marginBottom: 6 }}>{children}</div>;
}

function Stepper({ value, onChange, step = 5, min = 0 }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
      <button onClick={() => onChange(Math.max(min, value - step))} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>-</button>
      <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, width: 48, textAlign: "center", color: INK }}>{value}</span>
      <button onClick={() => onChange(value + step)} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>+</button>
      <span style={{ fontSize: 12, color: MUTED }}>min</span>
    </div>
  );
}

function OrderedListEditor({ items, onChange, placeholder }) {
  const [draft, setDraft] = useState("");
  const add = () => { if (!draft.trim()) return; onChange([...items, draft.trim()]); setDraft(""); };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const move = (i, dir) => {
    const next = [...items]; const j = i + dir;
    if (j < 0 || j >= next.length) return;
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  return (
    <div>
      {items.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {items.map((item, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 8, background: PAPER, border: `1px solid ${LINE}` }}>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: MUTED }}>{i + 1}</span>
              <span style={{ flex: 1, fontSize: 14, color: INK }}>{item}</span>
              <button onClick={() => move(i, -1)} disabled={i === 0} style={{ color: i === 0 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconUp size={16} /></button>
              <button onClick={() => move(i, 1)} disabled={i === items.length - 1} style={{ color: i === items.length - 1 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconDown size={16} /></button>
              <button onClick={() => remove(i)} style={{ color: "#B0413E", background: "none", border: "none" }}><IconX size={16} /></button>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()}
          placeholder={placeholder} style={{ flex: 1, fontSize: 14, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none" }} />
        <button onClick={add} style={{ width: 42, height: 42, borderRadius: 8, border: `1px solid ${LINE}`, color: MUTED, background: CARD, display: "flex", alignItems: "center", justifyContent: "center" }}><IconPlus size={18} /></button>
      </div>
    </div>
  );
}

function MedicationListEditor({ items, onChange }) {
  const [draft, setDraft] = useState("");
  const add = () => {
    if (!draft.trim()) return;
    onChange([...items, { name: draft.trim(), filterRequired: false }]);
    setDraft("");
  };
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const move = (i, dir) => {
    const next = [...items];
    const j = i + dir;
    if (j < 0 || j >= next.length) return;
    [next[i], next[j]] = [next[j], next[i]];
    onChange(next);
  };
  const setFilterRequired = (i, checked) => onChange(items.map((med, idx) => idx === i ? { ...med, filterRequired: checked } : med));
  return (
    <div>
      {items.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
          {items.map((med, i) => (
            <div key={i} style={{ padding: "8px 10px", borderRadius: 8, background: PAPER, border: `1px solid ${LINE}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: MUTED }}>{i + 1}</span>
                <span style={{ flex: 1, fontSize: 14, color: INK }}>{med.name}</span>
                <button onClick={() => move(i, -1)} disabled={i === 0} style={{ color: i === 0 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconUp size={16} /></button>
                <button onClick={() => move(i, 1)} disabled={i === items.length - 1} style={{ color: i === items.length - 1 ? "#C7CDCB" : MUTED, background: "none", border: "none" }}><IconDown size={16} /></button>
                <button onClick={() => remove(i)} style={{ color: "#B0413E", background: "none", border: "none" }}><IconX size={16} /></button>
              </div>
              <label style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, marginLeft: 19, fontSize: 13, color: MUTED }}>
                <input type="checkbox" checked={med.filterRequired} onChange={(e) => setFilterRequired(i, e.target.checked)} />
                Filter required?
              </label>
            </div>
          ))}
        </div>
      )}
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()}
          placeholder="e.g. Rituximab" style={{ flex: 1, fontSize: 14, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none" }} />
        <button onClick={add} style={{ height: 42, padding: "0 16px", borderRadius: 8, border: `1px solid ${ACCENT}`, color: ACCENT, background: CARD, fontSize: 14, fontWeight: 600 }}>Enter</button>
      </div>
    </div>
  );
}

function NewPatientForm({ existing, patient = null, onSave, onCancel }) {
  const [initials, setInitials] = useState(patient?.initials || "");
  const [type, setType] = useState(patient?.type || "chair");
  const [number, setNumber] = useState(patient?.number || 1);
  const [regimenLabel, setRegimenLabel] = useState(patient?.regimenLabel || "");
  const [labs, setLabs] = useState(patient?.labs || []);
  const [premeds, setPremeds] = useState(patient?.premeds || []);
  const [todayMeds, setTodayMeds] = useState((patient?.todayMeds || []).map((med) => typeof med === "string" ? { name: med, filterRequired: patient?.filterRequired || false } : med));
  const [vitalsSelections, setVitalsSelections] = useState(patient?.vitalsSelections || (patient?.vitalsIntervalMin === 15 ? ["15"] : patient?.vitalsIntervalMin === 30 ? ["every30"] : []));
  const [observationMin, setObservationMin] = useState(patient?.observationMin || 0);
  const [premedWaitMin, setPremedWaitMin] = useState(patient?.premedWaitMin ?? 30);

  const usedNumbers = existing.filter((p) => p.type === type && p.id !== patient?.id).map((p) => p.number);
  const numberTaken = usedNumbers.includes(number);
  const canSave = initials.trim().length > 0 && !numberTaken && todayMeds.length > 0;

  const save = () => {
    if (!canSave) return;
    onSave({
      ...(patient || {}), id: patient?.id || Date.now(), type, number, initials: initials.trim().toUpperCase(),
      regimenLabel: regimenLabel.trim(), labs, premeds, todayMeds, vitalsSelections, vitalsIntervalMin: vitalsSelections.includes("every30") ? 30 : 0, observationMin,
      premedWaitMin: premeds.length > 0 ? premedWaitMin : 0, stage: patient?.stage || "chart-review", notes: patient?.notes || [],
    });
  };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px" }}>
      <div style={{ fontSize: 18, fontWeight: 600, color: INK, marginBottom: 16 }}>{patient ? "Edit Patient" : "New Patient"}</div>
      <FieldLabel>Initials</FieldLabel>
      <input value={initials} onChange={(e) => setInitials(e.target.value)} placeholder="e.g. M.R."
        style={{ width: "100%", fontSize: 15, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none", marginBottom: 16 }} />

      <FieldLabel>Location</FieldLabel>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {["chair", "bed"].map((t) => (
          <button key={t} onClick={() => setType(t)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, textTransform: "capitalize",
            background: type === t ? ACCENT : CARD, color: type === t ? "#FFF" : INK, border: `1px solid ${type === t ? ACCENT : LINE}` }}>{t}</button>
        ))}
      </div>

      <FieldLabel>{type === "chair" ? "Chair" : "Bed"} number</FieldLabel>
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
        <button onClick={() => setNumber(Math.max(1, number - 1))} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>-</button>
        <input type="number" min="1" inputMode="numeric" value={number} onChange={(e) => setNumber(Math.max(1, Number(e.target.value) || 1))}
          aria-label={`${type === "chair" ? "Chair" : "Bed"} number`}
          style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, width: 64, height: 40, textAlign: "center", color: INK, background: CARD, border: `1px solid ${LINE}`, borderRadius: 8 }} />
        <button onClick={() => setNumber(number + 1)} style={{ width: 40, height: 40, borderRadius: 8, border: `1px solid ${LINE}`, color: INK, background: CARD }}>+</button>
      </div>
      {numberTaken ? <div style={{ fontSize: 12, marginBottom: 12, color: "#B0413E" }}>{locWord({ type })} {number} is already in use.</div> : <div style={{ marginBottom: 16 }} />}

      <FieldLabel>Regimen / treatment label (optional)</FieldLabel>
      <input value={regimenLabel} onChange={(e) => setRegimenLabel(e.target.value)} placeholder="i.e. FOLFOX, Iron"
        style={{ width: "100%", fontSize: 15, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none", marginBottom: 16 }} />

      <FieldLabel>Labs (optional)</FieldLabel>
      <div style={{ marginBottom: 16 }}><OrderedListEditor items={labs} onChange={setLabs} placeholder="e.g. CBC, BMP, or UA" /></div>

      <FieldLabel>Premeds, in order given</FieldLabel>
      <div style={{ marginBottom: 16 }}><OrderedListEditor items={premeds} onChange={setPremeds} placeholder="e.g. Diphenhydramine" /></div>

      <FieldLabel>Today's medications, in order</FieldLabel>
      <div style={{ marginBottom: 16 }}><MedicationListEditor items={todayMeds} onChange={setTodayMeds} /></div>

      <FieldLabel>Vitals During?</FieldLabel>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {[{ label: "15", value: "15" }, { label: "30", value: "30" }, { label: "End", value: "end" }, { label: "Every 30", value: "every30" }].map((option) => {
          const selected = vitalsSelections.includes(option.value);
          return (
            <button key={option.label} onClick={() => setVitalsSelections((current) => selected ? current.filter((value) => value !== option.value) : [...current, option.value])} style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500,
              background: selected ? ACCENT : CARD, color: selected ? "#FFF" : INK, border: `1px solid ${selected ? ACCENT : LINE}` }}>{option.label}</button>
          );
        })}
      </div>

      {premeds.length > 0 && (<>
        <FieldLabel>Premed wait time before infusing</FieldLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
          <Stepper value={premedWaitMin} onChange={setPremedWaitMin} step={5} min={0} />
          <button onClick={() => setPremedWaitMin(30)} style={{ padding: "10px 12px", borderRadius: 8, border: `1px solid ${ACCENT}`, color: ACCENT, background: CARD, fontSize: 13, fontWeight: 500, whiteSpace: "nowrap" }}>30 min</button>
        </div>
      </>)}

      <FieldLabel>Observation period after infusion</FieldLabel>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 24 }}>
        <Stepper value={observationMin} onChange={setObservationMin} step={5} min={0} />
        <button onClick={() => setObservationMin(30)} style={{ padding: "10px 12px", borderRadius: 8, border: `1px solid ${ACCENT}`, color: ACCENT, background: CARD, fontSize: 13, fontWeight: 500, whiteSpace: "nowrap" }}>30 min</button>
        <button onClick={() => setObservationMin(60)} style={{ padding: "10px 12px", borderRadius: 8, border: `1px solid ${ACCENT}`, color: ACCENT, background: CARD, fontSize: 13, fontWeight: 500, whiteSpace: "nowrap" }}>60 min</button>
      </div>

      <div style={{ display: "flex", gap: 8, paddingBottom: 16 }}>
        <button onClick={onCancel} style={{ flex: 1, padding: "12px 0", borderRadius: 8, fontSize: 15, fontWeight: 500, border: `1px solid ${LINE}`, color: MUTED, background: CARD }}>Cancel</button>
        <button onClick={save} disabled={!canSave} style={{ flex: 1, padding: "12px 0", borderRadius: 8, fontSize: 15, fontWeight: 500, background: canSave ? ACCENT : "#C9DAD3", color: "#FFF", border: "none" }}>{patient ? "Save patient" : "Add patient"}</button>
      </div>
      {!canSave && <div style={{ fontSize: 12, paddingBottom: 24, color: MUTED }}>Needs initials, an open {type} number, and at least one medication for today.</div>}
    </div>
  );
}

function TabBar({ patients, activeId, onSelect, onAddTab }) {
  return (
    <div style={{ display: "flex", overflowX: "auto", background: CARD, borderBottom: `1px solid ${LINE}`, WebkitOverflowScrolling: "touch" }}>
      {patients.map((p) => {
        const isActive = p.id === activeId;
        const cfg = STAGES[p.stage];
        const needsAttention = !!p.timerAlert || !!p.premedAlert;
        return (
          <button key={p.id} onClick={() => onSelect(p.id)} style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2, flexShrink: 0,
            width: 66, height: 66, borderBottom: `3px solid ${isActive ? cfg.color : "transparent"}`, background: needsAttention ? "#FFF2CC" : "none", border: "none", borderBottomWidth: 3, borderBottomStyle: "solid", borderBottomColor: isActive ? cfg.color : "transparent",
            animation: needsAttention ? "premed-alert-pulse 1s ease-in-out infinite" : "none" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: 600, color: isActive ? INK : MUTED }}>{locLabel(p)}</span>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: isActive ? INK : MUTED }}>{p.initials}</span>
            <span style={{ width: 6, height: 6, borderRadius: 999, background: cfg.color }} />
          </button>
        );
      })}
      <button onClick={onAddTab} style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, flexShrink: 0, width: 66, height: 66, background: "none", border: "none", borderBottom: `3px solid ${activeId === "new" ? ACCENT : "transparent"}` }}>
        <IconPlus size={18} color={activeId === "new" ? ACCENT : MUTED} />
      </button>
    </div>
  );
}

function ChecklistGate({ items, checked, onToggle }) {
  return (
    <div style={{ marginTop: 16, borderRadius: 10, padding: 16, background: "#F7F5FB", border: "1px solid #E1D9F2" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 12 }}>
        <IconShield size={14} color="#6E5AA3" />
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textTransform: "uppercase", letterSpacing: "0.04em", color: "#6E5AA3" }}>Confirm before continuing</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {items.map((item, i) => item ? (
          <label key={i} style={{ display: "flex", alignItems: "flex-start", gap: 12, fontSize: 15, lineHeight: 1.4, color: INK, cursor: "pointer" }}>
            <input type="checkbox" checked={!!checked[i]} onChange={() => onToggle(i)} style={{ width: 20, height: 20, marginTop: 2, flexShrink: 0 }} />
            <span>{item}</span>
          </label>
        ) : null)}
      </div>
    </div>
  );
}

function NotesSection({ notes, onAdd }) {
  const [draft, setDraft] = useState("");
  const { listening, supported, start, stop } = useVoiceInput(onAdd);
  const submit = () => { if (!draft.trim()) return; onAdd(draft.trim()); setDraft(""); };
  return (
    <div style={{ marginTop: 20 }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", color: MUTED, marginBottom: 8 }}>Notes</div>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Add a note\u2026"
          style={{ flex: 1, fontSize: 15, padding: "10px 12px", borderRadius: 8, border: `1px solid ${LINE}`, color: INK, outline: "none" }} />
        <button onClick={submit} style={{ borderRadius: 8, border: `1px solid ${LINE}`, color: MUTED, width: 42, height: 42, flexShrink: 0, background: CARD, display: "flex", alignItems: "center", justifyContent: "center" }}><IconPlus size={18} /></button>
        <button onClick={listening ? stop : start} style={{ borderRadius: 8, border: `1px solid ${listening ? "#B0413E" : LINE}`, color: listening ? "#B0413E" : MUTED, background: listening ? "#FBEAE9" : CARD, width: 42, height: 42, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {supported ? <IconMic size={18} /> : <IconMicOff size={18} />}
        </button>
      </div>
      {!supported && <div style={{ fontSize: 11, marginTop: 6, color: MUTED }}>Voice input isn\u2019t supported in this browser \u2014 works in Safari/Chrome with mic permission granted.</div>}
      {notes.length > 0 && (
        <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
          {notes.slice().reverse().map((n, i) => (
            <div key={i} style={{ fontSize: 13, color: MUTED }}><span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{n.t}</span> \u2014 {n.text}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function VitalsTimers({ timers, onComplete }) {
  if (!timers?.length) return null;
  return (
    <div style={{ marginTop: 18 }}>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, textTransform: "uppercase", color: MUTED, marginBottom: 8 }}>Vitals</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 8 }}>
        {timers.map((timer, index) => {
          const urgent = timer.remaining !== null && timer.remaining <= 3 && !timer.completedAt;
          return (
            <button key={timer.key} onClick={() => onComplete(index)} style={{ padding: "10px", textAlign: "left", borderRadius: 8, background: timer.completedAt ? "#E8F3EE" : urgent ? "#FBEAE9" : CARD, border: `1px solid ${timer.completedAt ? "#A8D0BC" : urgent ? "#E7B9B6" : LINE}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: timer.completedAt ? "#3B7A57" : urgent ? "#B0413E" : INK }}>{timer.label}</div>
              <div className="tabular-nums" style={{ marginTop: 4, fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, color: INK }}>{timer.completedAt ? `Done ${timer.completedAt}` : timer.dueAt ? mmss(timer.remaining || 0) : "At end"}</div>
              {timer.recurring && !timer.completedAt && <div style={{ marginTop: 2, fontSize: 10, color: MUTED }}>Tap when checked · resets 30 min</div>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function MedicationTimers({ p, onToggleMedicationCheck, onStartMedication, onCompleteMedication, onNextMedication }) {
  const medications = (p.todayMeds || []).map((entry) => typeof entry === "string" ? { name: entry, filterRequired: false } : entry);
  const runs = p.medicationRuns || medications.map((med) => ({ name: med.name, filterRequired: med.filterRequired, orderConfirmed: false, filterReady: false, status: "pending", elapsedSeconds: 0 }));
  const currentIndex = Math.min(p.currentMedicationIndex || 0, Math.max(0, runs.length - 1));
  return (
    <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 16 }}>
      {runs.map((run, index) => {
        const isCurrent = index === currentIndex;
        const isUpcoming = index > currentIndex;
        const readyToStart = run.orderConfirmed && (!run.filterRequired || run.filterReady);
        return (
          <div key={`${run.name}-${index}`} style={{ padding: 16, borderRadius: 12, background: CARD, border: `1px solid ${isCurrent ? ACCENT : LINE}` }}>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: MUTED, textTransform: "uppercase", marginBottom: 4 }}>Medication {index + 1} of {runs.length}{isUpcoming ? " · Upcoming" : ""}</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: INK, marginBottom: 12 }}>{run.name}</div>
            <label style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, fontSize: 14, color: INK }}>
              <input type="checkbox" checked={!!run.orderConfirmed} disabled={!isCurrent || run.status !== "pending"} onChange={(e) => onToggleMedicationCheck(index, "orderConfirmed", e.target.checked)} />
              Medication order confirmed: {run.name}
            </label>
            {run.filterRequired && (
              <label style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10, fontSize: 14, color: INK }}>
                <input type="checkbox" checked={!!run.filterReady} disabled={!isCurrent || run.status !== "pending"} onChange={(e) => onToggleMedicationCheck(index, "filterReady", e.target.checked)} />
                Filter ready: {run.name}
              </label>
            )}
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 14 }}>
              <IconClock size={18} color={MUTED} />
              <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 40, color: INK }}>{mmss((run.elapsedSeconds || 0) / 60)}</span>
              <span style={{ fontSize: 12, color: MUTED }}>{run.status === "complete" ? "completed" : run.status === "running" ? "elapsed" : "ready"}</span>
            </div>
            {run.status === "pending" && isCurrent && (
              <button onClick={() => onStartMedication(index)} disabled={!readyToStart} style={{ width: "100%", marginTop: 12, padding: "12px 0", borderRadius: 8, border: "none", background: readyToStart ? ACCENT : "#C9DAD3", color: "#FFF", fontSize: 15, fontWeight: 500 }}>Start timer</button>
            )}
            {run.status === "running" && isCurrent && (
              <button onClick={() => onCompleteMedication(index)} style={{ width: "100%", marginTop: 12, padding: "12px 0", borderRadius: 8, border: "none", background: "#3B7A57", color: "#FFF", fontSize: 15, fontWeight: 500 }}>Complete medication</button>
            )}
            {run.status === "complete" && <div style={{ marginTop: 8, fontSize: 12, color: MUTED }}>Completed at {run.completedAt} · Duration {mmss((run.elapsedSeconds || 0) / 60)}</div>}
            {run.status === "complete" && isCurrent && index < runs.length - 1 && (
              <button onClick={() => onNextMedication(index)} style={{ width: "100%", marginTop: 12, padding: "12px 0", borderRadius: 8, border: `1px solid ${ACCENT}`, background: CARD, color: ACCENT, fontSize: 15, fontWeight: 500 }}>Advance to next medication</button>
            )}
          </div>
        );
      })}
    </div>
  );
}

function BayScreen({ p, checked, onToggleCheck, onSetPortAccess, onAddNote, onDelete, onCompleteVitals, onToggleMedicationCheck, onStartMedication, onCompleteMedication, onNextMedication }) {
  const cfg = STAGES[p.stage];
  const isGated = !!cfg.gate;
  const gateItems = cfg.gate === "GENERAL" ? GENERAL_CHECKLIST : cfg.gate === "PREINFUSION" ? buildPreInfusionChecklist(p) : cfg.gate === "DISCHARGE" ? DISCHARGE_CHECKLIST : [];

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "20px 20px", borderTop: `4px solid ${cfg.color}` }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
        <div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, letterSpacing: "0.05em", color: MUTED }}>{locWord(p).toUpperCase()} {p.number}</div>
          <div style={{ fontSize: 20, fontWeight: 600, marginTop: 2, color: INK }}>{p.initials}</div>
        </div>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, textTransform: "uppercase", letterSpacing: "0.04em", padding: "4px 10px", borderRadius: 999, color: cfg.color, background: `${cfg.color}1A` }}>{cfg.label}</span>
      </div>

      {p.regimenLabel && <div style={{ fontSize: 14, marginTop: 4, color: MUTED }}>{p.regimenLabel}</div>}

      {p.stage === "infusing" && <VitalsTimers timers={p.vitalsTimers} onComplete={onCompleteVitals} />}
      {p.stage === "infusing" && <MedicationTimers p={p} onToggleMedicationCheck={onToggleMedicationCheck} onStartMedication={onStartMedication} onCompleteMedication={onCompleteMedication} onNextMedication={onNextMedication} />}

      {cfg.timer && (
        <div style={{ marginTop: 24, display: "flex", alignItems: "baseline", gap: 8 }}>
          <IconClock size={18} color={MUTED} />
          <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 48, color: INK }}>{mmss(p.remaining)}</span>
          <span style={{ fontSize: 12, color: MUTED }}>wait remaining</span>
        </div>
      )}
      {cfg.countUp && (
        <div style={{ marginTop: 24, display: "flex", alignItems: "baseline", gap: 8 }}>
          <IconClock size={18} color={MUTED} />
          <span className="tabular-nums" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 48, color: INK }}>{mmss(p.elapsed)}</span>
          <span style={{ fontSize: 12, color: MUTED }}>elapsed</span>
        </div>
      )}
      {cfg.countUp && <div style={{ fontSize: 12, marginTop: 4, color: MUTED }}>Pump manages actual completion \u2014 for your reference only.</div>}

      {p.stage === "complete" && (
        <div style={{ marginTop: 24, display: "flex", alignItems: "center", gap: 8 }}>
          <IconCheck size={20} color={cfg.color} />
          <span style={{ fontSize: 15, color: INK }}>Visit complete \u2014 bay ready to reset</span>
        </div>
      )}

      {isGated && <ChecklistGate items={gateItems} checked={checked} onToggle={onToggleCheck} />}
      {p.stage === "chart-review" && (
        <div style={{ marginTop: 12, padding: 16, borderRadius: 10, background: CARD, border: `1px solid ${LINE}` }}>
          <div style={{ fontSize: 15, fontWeight: 500, color: INK, marginBottom: 10 }}>Port access?</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[{ label: "Yes", value: true }, { label: "No", value: false }].map((option) => {
              const selected = p.portAccess === option.value;
              return <button key={option.label} onClick={() => onSetPortAccess(option.value)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, background: selected ? ACCENT : CARD, color: selected ? "#FFF" : INK, border: `1px solid ${selected ? ACCENT : LINE}` }}>{option.label}</button>;
            })}
          </div>
        </div>
      )}
      <NotesSection notes={p.notes} onAdd={onAddNote} />
      <button onClick={onDelete} style={{ marginTop: 24, width: "100%", padding: "10px 0", borderRadius: 8, fontSize: 14, fontWeight: 500, color: "#B0413E", background: CARD, border: "1px solid #E7B9B6" }}>
        Delete patient
      </button>
    </div>
  );
}

function BottomBar({ p, checked, onAdvance, onRetreat, onBackToNew, onGateContinue }) {
  if (!p) return null;
  const cfg = STAGES[p.stage];
  const isGated = !!cfg.gate;
  const gateItems = isGated ? (cfg.gate === "GENERAL" ? GENERAL_CHECKLIST : cfg.gate === "PREINFUSION" ? buildPreInfusionChecklist(p) : DISCHARGE_CHECKLIST) : [];
  const allDone = gateItems.every((item, i) => !item || checked[i]) && (p.stage !== "chart-review" || typeof p.portAccess === "boolean");
  const allMedicationsComplete = p.stage !== "infusing" || ((p.medicationRuns || []).length > 0 && p.medicationRuns.every((run) => run.status === "complete"));
  return (
    <div style={{ display: "flex", gap: 8, padding: "12px 20px", borderTop: `1px solid ${LINE}`, background: CARD }}>
      {(cfg.previous || p.stage === "chart-review") && (
        <button onClick={cfg.previous ? onRetreat : onBackToNew} style={{ flex: 1, fontSize: 15, fontWeight: 500, padding: "14px 0", borderRadius: 10, background: CARD, color: MUTED, border: `1px solid ${LINE}` }}>
          {cfg.previous ? `Back to: ${STAGES[cfg.previous].label}` : "Back to New Patient"}
        </button>
      )}
      {cfg.next && (
        <button onClick={isGated ? onGateContinue : onAdvance} disabled={(isGated && !allDone) || !allMedicationsComplete} style={{ flex: 1, fontSize: 15, fontWeight: 500, padding: "14px 0", borderRadius: 10, background: (isGated && !allDone) || !allMedicationsComplete ? "#DCD5EA" : cfg.color, color: "#FFF", border: "none" }}>
          {!allMedicationsComplete ? "Complete all medications to continue" : isGated ? (allDone ? "Confirmed \u2014 continue" : "Check all items to continue") : `Advance to: ${STAGES[cfg.next].label}`}
        </button>
      )}
    </div>
  );
}

function loadPatients() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw).map((savedPatient) => {
      const patient = savedPatient.stage === "waiting" || savedPatient.stage === "access" ? { ...savedPatient, stage: "chart-review" } : { ...savedPatient };
      if (STAGES[patient.stage]?.timer && patient.timerEndsAt) {
        patient.remaining = Math.max(0, (patient.timerEndsAt - Date.now()) / 60000);
        if (patient.remaining === 0 && !patient.stageTimerAlerted) {
          patient.timerAlert = true;
          patient.stageTimerAlerted = true;
        }
      } else if (STAGES[patient.stage]?.timer && patient.remaining > 0) {
        patient.timerEndsAt = Date.now() + patient.remaining * 60000;
      }
      if (!patient.vitalsSelections) patient.vitalsSelections = patient.vitalsIntervalMin === 15 ? ["15"] : patient.vitalsIntervalMin === 30 ? ["every30"] : [];
      if (patient.stage === "infusing" && !patient.vitalsTimers) patient.vitalsTimers = buildVitalsTimers(patient.vitalsSelections);
      if (patient.vitalsTimers) patient.vitalsTimers = patient.vitalsTimers.map((timer) => {
        if (!timer.dueAt || timer.completedAt) return timer;
        const remaining = Math.max(0, (timer.dueAt - Date.now()) / 60000);
        if (remaining === 0 && !timer.alerted) {
          patient.timerAlert = true;
          return { ...timer, remaining, alerted: true };
        }
        return { ...timer, remaining };
      });
      if (patient.stage === "infusing" && !patient.medicationRuns) {
        const medications = (patient.todayMeds || []).map((entry) => typeof entry === "string" ? { name: entry, filterRequired: false } : entry);
        patient.medicationRuns = medications.map((med) => ({ name: med.name, filterRequired: !!med.filterRequired, orderConfirmed: false, filterReady: false, status: "pending", elapsedSeconds: 0 }));
        patient.currentMedicationIndex = 0;
      }
      if (patient.medicationRuns) patient.medicationRuns = patient.medicationRuns.map((run) => run.status === "running" && !run.startedAtMs ? { ...run, startedAtMs: Date.now() - (run.elapsedSeconds || 0) * 1000 } : run);
      return patient;
    });
  } catch (e) {}
  return [
    { id: 1, type: "chair", number: 1, initials: "J.A.", regimenLabel: "", labs: [], premeds: [], todayMeds: [], vitalsSelections: [], vitalsIntervalMin: 0, observationMin: 0, premedWaitMin: 0, stage: "chart-review", notes: [] },
  ];
}

function loadCheckedMap() {
  try {
    const raw = localStorage.getItem(CHECKED_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function App() {
  const [patients, setPatients] = useState(loadPatients);
  const [activeId, setActiveId] = useState(patients[0]?.id ?? "new");
  const [editingId, setEditingId] = useState(null);
  const [checkedMap, setCheckedMap] = useState(loadCheckedMap);
  const vibratedAlertsRef = useRef(new Set());

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(patients)); } catch (e) {}
  }, [patients]);

  useEffect(() => {
    try { localStorage.setItem(CHECKED_STORAGE_KEY, JSON.stringify(checkedMap)); } catch (e) {}
  }, [checkedMap]);

  useEffect(() => {
    patients.forEach((patient) => {
      if ((!patient.timerAlert && !patient.premedAlert) || vibratedAlertsRef.current.has(patient.id)) return;
      vibratedAlertsRef.current.add(patient.id);
      if (navigator.vibrate) navigator.vibrate([250, 120, 250]);
    });
  }, [patients]);

  useEffect(() => {
    const t = setInterval(() => {
      setPatients((prev) => prev.map((p) => {
        const cfg = STAGES[p.stage];
        let next = { ...p };
        if (cfg.timer && p.timerEndsAt) {
          const previousRemaining = p.remaining || 0;
          next.remaining = Math.max(0, (p.timerEndsAt - Date.now()) / 60000);
          if (previousRemaining > 0 && next.remaining === 0 && !p.stageTimerAlerted) {
            next.timerAlert = true;
            next.stageTimerAlerted = true;
          }
        }
        if (p.stage === "infusing" && p.medicationRuns?.length) {
          const currentIndex = p.currentMedicationIndex || 0;
          next.medicationRuns = p.medicationRuns.map((run, index) => index === currentIndex && run.status === "running" ? { ...run, elapsedSeconds: run.startedAtMs ? Math.max(0, Math.floor((Date.now() - run.startedAtMs) / 1000)) : (run.elapsedSeconds || 0) + 1 } : run);
        }
        if (p.stage === "infusing" && p.vitalsTimers) {
          let vitalsAlertTriggered = false;
          next.vitalsTimers = p.vitalsTimers.map((timer) => {
            if (!timer.dueAt || timer.completedAt) return timer;
            const remaining = Math.max(0, (timer.dueAt - Date.now()) / 60000);
            if (remaining === 0 && !timer.alerted) {
              vitalsAlertTriggered = true;
              return { ...timer, remaining, alerted: true };
            }
            return { ...timer, remaining };
          });
          if (vitalsAlertTriggered) next.timerAlert = true;
        }
        return next;
      }));
    }, 1000);
    return () => clearInterval(t);
  }, []);

  const nowTime = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

  const onAdvance = useCallback((id) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const next = STAGES[p.stage].next;
      if (!next) return p;
      const nextCfg = STAGES[next];
      const updated = { ...p, stage: next };
      if (nextCfg.timer) {
        updated.remaining = next === "premed-wait" ? p.premedWaitMin : p.observationMin;
        updated.timerEndsAt = Date.now() + updated.remaining * 60000;
        updated.stageTimerAlerted = false;
      }
      if (next === "premed-wait") updated.premedAlert = false;
      if (next === "infusing") {
        const medications = (p.todayMeds || []).map((entry) => typeof entry === "string" ? { name: entry, filterRequired: false } : entry);
        const runsMatch = p.medicationRuns?.length === medications.length && p.medicationRuns.every((run, index) => run.name === medications[index].name);
        if (!runsMatch) {
          updated.medicationRuns = medications.map((med) => ({ name: med.name, filterRequired: !!med.filterRequired, orderConfirmed: false, filterReady: false, status: "pending", elapsedSeconds: 0 }));
          updated.currentMedicationIndex = 0;
        }
        const vitalsSignature = JSON.stringify(p.vitalsSelections || []);
        if (!p.vitalsTimers || p.vitalsTimersSignature !== vitalsSignature) {
          updated.vitalsTimers = buildVitalsTimers(p.vitalsSelections || []);
          updated.vitalsTimersSignature = vitalsSignature;
        }
      }
      return updated;
    }));
  }, []);

  const onRetreat = useCallback((id) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      const previous = STAGES[p.stage].previous;
      return previous ? { ...p, stage: previous } : p;
    }));
  }, []);

  const onGateContinue = useCallback((id) => { onAdvance(id); }, [onAdvance]);
  const onToggleCheck = useCallback((id, stage, idx) => {
    setCheckedMap((prev) => {
      const patientChecks = prev[id] || {};
      const stageChecks = patientChecks[stage] || {};
      return { ...prev, [id]: { ...patientChecks, [stage]: { ...stageChecks, [idx]: !stageChecks[idx] } } };
    });
  }, []);
  const onSetPortAccess = useCallback((id, value) => {
    setPatients((prev) => prev.map((patient) => patient.id === id ? { ...patient, portAccess: value } : patient));
  }, []);
  const onAddNote = useCallback((id, text) => { setPatients((prev) => prev.map((p) => (p.id === id ? { ...p, notes: [...p.notes, { t: nowTime(), text }] } : p))); }, []);
  const onCompleteVitals = useCallback((id, index) => {
    setPatients((prev) => prev.map((p) => p.id === id ? { ...p, vitalsTimers: p.vitalsTimers.map((timer, i) => {
      if (i !== index) return timer;
      if (timer.recurring) return { ...timer, dueAt: Date.now() + 30 * 60000, remaining: 30, alerted: false };
      return { ...timer, completedAt: nowTime(), completedAtMs: Date.now(), remaining: 0 };
    }) } : p));
  }, []);
  const onToggleMedicationCheck = useCallback((id, index, field, checked) => {
    setPatients((prev) => prev.map((p) => p.id === id ? { ...p, medicationRuns: p.medicationRuns.map((run, i) => i === index ? { ...run, [field]: checked } : run) } : p));
  }, []);
  const onStartMedication = useCallback((id, index) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id) return p;
      return { ...p, medicationRuns: p.medicationRuns.map((run, i) => {
        if (i !== index || run.status !== "pending" || !run.orderConfirmed || (run.filterRequired && !run.filterReady)) return run;
        return { ...run, status: "running", startedAt: nowTime(), startedAtMs: Date.now(), elapsedSeconds: 0 };
      }) };
    }));
  }, []);
  const onCompleteMedication = useCallback((id, index) => {
    setPatients((prev) => prev.map((p) => p.id === id ? { ...p, medicationRuns: p.medicationRuns.map((run, i) => i === index && run.status === "running" ? { ...run, status: "complete", completedAt: nowTime(), completedAtMs: Date.now(), elapsedSeconds: run.startedAtMs ? Math.max(0, Math.floor((Date.now() - run.startedAtMs) / 1000)) : run.elapsedSeconds || 0 } : run) } : p));
  }, []);
  const onNextMedication = useCallback((id, index) => {
    setPatients((prev) => prev.map((p) => {
      if (p.id !== id || p.medicationRuns?.[index]?.status !== "complete" || index >= p.medicationRuns.length - 1) return p;
      return { ...p, currentMedicationIndex: index + 1 };
    }));
  }, []);
  const onSavePatient = useCallback((patient) => {
    setPatients((prev) => prev.some((p) => p.id === patient.id) ? prev.map((p) => p.id === patient.id ? patient : p) : [...prev, patient]);
    setEditingId(null);
    setActiveId(patient.id);
  }, []);
  const onDeletePatient = useCallback((id) => {
    const patient = patients.find((p) => p.id === id);
    if (!patient || !window.confirm(`Delete ${locWord(patient)} ${patient.number} (${patient.initials})?`)) return;
    const remaining = patients.filter((p) => p.id !== id);
    setPatients(remaining);
    setCheckedMap((prev) => {
      const next = { ...prev };
      delete next[id];
      return next;
    });
    setActiveId(remaining[0]?.id ?? "new");
  }, [patients]);

  const onSelectPatient = useCallback((id) => {
    setPatients((prev) => prev.map((patient) => patient.id === id ? { ...patient, premedAlert: false, timerAlert: false } : patient));
    vibratedAlertsRef.current.delete(id);
    setEditingId(null);
    setActiveId(id);
  }, []);

  const activePatient = activeId === "new" ? null : patients.find((p) => p.id === activeId);
  const editingPatient = editingId === null ? null : patients.find((p) => p.id === editingId);
  const activeChecked = activeId === "new" || !activePatient ? {} : checkedMap[activeId]?.[activePatient.stage] || {};

  return (
    <div style={{ width: "100%", display: "flex", justifyContent: "center", background: "#E7E9E7", minHeight: "100vh" }}>
      <div style={{ width: "100%", maxWidth: PHONE_W, minHeight: "100vh", background: PAPER, display: "flex", flexDirection: "column" }}>
        <TabBar patients={patients} activeId={activeId} onSelect={onSelectPatient} onAddTab={() => { setEditingId(null); setActiveId("new"); }} />
        {activeId === "new" ? (
          <NewPatientForm key={editingPatient?.id || "new"} existing={patients} patient={editingPatient} onSave={onSavePatient} onCancel={() => { setActiveId(editingPatient?.id ?? patients[0]?.id ?? "new"); setEditingId(null); }} />
        ) : activePatient ? (
          <>
            <BayScreen p={activePatient} checked={activeChecked} onToggleCheck={(i) => onToggleCheck(activeId, activePatient.stage, i)} onSetPortAccess={(value) => onSetPortAccess(activeId, value)} onAddNote={(text) => onAddNote(activeId, text)} onDelete={() => onDeletePatient(activeId)} onCompleteVitals={(index) => onCompleteVitals(activeId, index)}
              onToggleMedicationCheck={(index, field, checked) => onToggleMedicationCheck(activeId, index, field, checked)} onStartMedication={(index) => onStartMedication(activeId, index)} onCompleteMedication={(index) => onCompleteMedication(activeId, index)} onNextMedication={(index) => onNextMedication(activeId, index)} />
            <BottomBar p={activePatient} checked={activeChecked} onAdvance={() => onAdvance(activeId)} onRetreat={() => onRetreat(activeId)} onBackToNew={() => { setEditingId(activeId); setActiveId("new"); }} onGateContinue={() => onGateContinue(activeId)} />
          </>
        ) : (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12, color: MUTED }}>
            <IconDoor size={32} />
            <div style={{ fontSize: 14 }}>No patients yet \u2014 tap + to add one</div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
